<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Seedance AI Studio — визуальная библиотека промтов и референсов." />
  <title>Seedance AI Studio</title>
  <style>
    :root{--bg:#08090d;--panel:#11131a;--panel2:#171a24;--text:#f6f7fb;--muted:#9298a8;--line:#282c39;--accent:#b7ff4a;--violet:#8f7cff;--pink:#ff6fbd}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% -10%,#27316d55,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:#0b0c11e8;backdrop-filter:blur(18px);z-index:3}.brand{display:flex;align-items:center;gap:11px;margin:4px 8px 32px;font-weight:800;font-size:20px;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#55e6ff);color:#0b0c11}.eyebrow{margin:25px 10px 10px;text-transform:uppercase;color:#656b7a;font-size:10px;font-weight:800;letter-spacing:.15em}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left;transition:.2s}.nav button:hover,.nav button.active{background:#20242f;color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.count{margin-left:auto;color:#697080;font-size:12px}.sidebar-note{position:absolute;left:18px;right:18px;bottom:22px;padding:15px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#191d2a,#10121a);color:var(--muted);font-size:12px}.sidebar-note strong{display:block;color:var(--text);margin-bottom:5px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;padding:18px 30px;border-bottom:1px solid #242734aa;background:#08090dcc;backdrop-filter:blur(18px)}.search{display:flex;align-items:center;gap:10px;flex:1;max-width:620px;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:#151720;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.top-actions{margin-left:auto;display:flex;gap:9px}.ghost,.primary{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#151720;color:var(--text)}.primary{border:0;background:var(--accent);color:#0b0c11;font-weight:800}.hero{display:flex;align-items:end;justify-content:space-between;gap:28px;padding:48px 30px 25px}.hero h1{max-width:760px;margin:0 0 10px;font-size:clamp(34px,5vw,64px);line-height:.98;letter-spacing:-.065em}.hero h1 span{color:var(--accent)}.hero p{max-width:650px;margin:0;color:var(--muted);font-size:16px}.upload{min-width:210px;padding:16px;border:1px dashed #5b6478;border-radius:18px;background:#11141d;text-align:left;color:var(--text)}.upload small{display:block;color:var(--muted);margin-top:6px}.toolbar{display:flex;align-items:center;gap:9px;overflow:auto;padding:0 30px 24px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:transparent;color:var(--muted)}.chip.active,.chip:hover{background:var(--text);border-color:var(--text);color:#090a0e}.gallery{column-count:4;column-gap:16px;padding:0 30px 50px}.card{display:inline-block;width:100%;margin:0 0 16px;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel);break-inside:avoid;transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-4px);border-color:#596177;box-shadow:0 18px 45px #0008}.visual{position:relative;min-height:180px;display:flex;align-items:end;padding:16px;overflow:hidden;background:linear-gradient(140deg,var(--c1),var(--c2))}.visual:before,.visual:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.75}.visual:before{width:180px;height:180px;right:-30px;top:-40px;background:#fff5;mix-blend-mode:overlay}.visual:after{width:120px;height:120px;left:-30px;bottom:-45px;background:#0005}.visual.tall{min-height:290px}.visual.square{min-height:235px}.visual-label{position:relative;z-index:1;max-width:85%;font-size:28px;font-weight:900;line-height:1;letter-spacing:-.06em}.visual-sub{position:absolute;right:14px;top:14px;z-index:1;padding:5px 8px;border-radius:8px;background:#0006;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.card-body{padding:15px}.card-title{margin:0 0 5px;font-size:16px}.card-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;color:var(--muted);font-size:13px}.card-foot{display:flex;align-items:center;gap:8px;margin-top:14px}.tag{padding:5px 8px;border-radius:8px;background:#222633;color:#b9c0cf;font-size:11px}.card-foot .copy{margin-left:auto;border:0;border-radius:9px;padding:8px 10px;background:#292e3c;color:var(--text);font-size:12px}.card-foot .copy:hover{background:var(--accent);color:#0b0c11}.empty{padding:60px 30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:#000b;backdrop-filter:blur(12px)}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:90vh;overflow:auto;border:1px solid #41485c;border-radius:24px;background:#12151e;box-shadow:0 30px 100px #000}.dialog-head{display:flex;justify-content:space-between;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line)}.dialog h2{margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.dialog-body{padding:24px}.prompt{white-space:pre-wrap;padding:18px;border:1px solid var(--line);border-radius:14px;background:#090b10;color:#dfe5ef;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}.modal-actions{display:flex;gap:10px;margin-top:16px}.hidden{display:none!important}@media(max-width:1100px){.gallery{column-count:3}}@media(max-width:800px){.app{display:block}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.brand{margin-bottom:14px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.sidebar-note{display:none}.eyebrow{display:none}.topbar{padding:12px 16px}.top-actions{display:none}.hero{display:block;padding:32px 16px 20px}.upload{margin-top:22px}.toolbar{padding:0 16px 20px}.gallery{column-count:2;padding:0 16px 35px;column-gap:10px}.card{margin-bottom:10px;border-radius:14px}.visual{min-height:150px}.visual.tall{min-height:220px}.visual.square{min-height:190px}}@media(max-width:480px){.gallery{column-count:1}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span> Seedance Studio</div>
      <div class="eyebrow">Library</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-note"><strong>Твоя идея → визуал</strong>Выбери карточку, скопируй промт и добавь своё фото в Seedance.</div>
    </aside>
    <main class="main">
      <header class="topbar"><label class="search">⌕ <input id="search" placeholder="Поиск промтов, брендов, эффектов..." /></label><div class="top-actions"><button class="ghost" id="favoritesBtn">♡ Избранное</button><button class="primary" id="uploadTop">＋ Моё фото</button></div></header>
      <section class="hero"><div><h1>Создавай визуалы,<br><span>которые хочется сохранить.</span></h1><p>Визуальная библиотека промтов для одежды, брендов, 3D‑товаров, жидких эффектов, рекламы и cinematic‑сцен.</p></div><button class="upload" id="uploadHero">◉ Загрузить своё фото<small>Фото останется только в этом браузере</small></button><input class="hidden" type="file" id="file" accept="image/*" /></section>
      <div class="toolbar" id="chips"></div>
      <section class="gallery" id="gallery"></section>
    </main>
  </div>
  <div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="close" id="close">×</button></div><div class="dialog-body"><p id="modalMeta" class="card-desc"></p><div class="prompt" id="modalPrompt"></div><div class="modal-actions"><button class="primary" id="modalCopy">Скопировать промт</button><button class="ghost" id="modalUse">Использовать с моим фото</button></div></div></div></div>
  <script>
    const categories=[['all','Все идеи','✦'],['fashion','Fashion & brands','◈'],['product','3D products','◇'],['effects','Liquid & effects','◌'],['cinematic','Cinematic','◉'],['anime','Anime & characters','✧'],['social','UGC & social','◎']];
    const items=[
      {cat:'fashion',title:'Chrome Runway',desc:'Футуристичная fashion‑кампания с зеркальной тканью и жидким хромом.',tag:'FASHION',size:'tall',c1:'#ef4f9b',c2:'#24134d',label:'CHROME\nRUNWAY',prompt:'Create a high-fashion editorial video using my reference photo. Keep my face and identity consistent. Dress me in a sculptural liquid-chrome outfit on a black reflective runway. Slow dolly camera, dramatic rim light, silver reflections, luxury fashion campaign, 9:16, premium art direction.'},
      {cat:'product',title:'Floating Sneaker Lab',desc:'Товарная 3D‑сцена: кроссовок парит среди стекла и мягких волн.',tag:'3D PRODUCT',size:'square',c1:'#5b7cff',c2:'#0ce4d1',label:'FLOATING\nSNEAKER',prompt:'Turn the product in my reference image into a premium 3D product commercial. The sneaker floats in a clean studio, surrounded by transparent glass shards and slow liquid waves. Macro details, softbox reflections, precise product geometry, seamless camera orbit, 4K commercial lighting.'},
      {cat:'effects',title:'Liquid Melt Portrait',desc:'Портрет плавно превращается в сияющую жидкую скульптуру.',tag:'LIQUID',size:'tall',c1:'#ffb36b',c2:'#7136d5',label:'LIQUID\nMELT',prompt:'Use my photo as the main character and preserve my identity. Create a seamless liquid-melting transformation: skin and clothing become glossy translucent fluid, flowing upward and reforming into a polished portrait. Slow motion, realistic viscosity, studio lighting, elegant surrealism, no face distortion.'},
      {cat:'cinematic',title:'Neon Rain Cinema',desc:'Ночной город, мокрый асфальт, неон и кинематографичный проход камеры.',tag:'CINEMATIC',c1:'#111d54',c2:'#e32674',label:'NEON\nRAIN',prompt:'Place the person from my reference photo in a cinematic neon city at night. Wet streets, colorful reflections, rain, shallow depth of field, slow handheld push-in, subtle wind in clothing, emotional expression, premium music-video cinematography, 15 seconds.'},
      {cat:'fashion',title:'Luxury Beauty Ad',desc:'Рекламный beauty‑кадр: кожа, макияж, парфюм и мягкий свет.',tag:'BEAUTY',size:'square',c1:'#ffd1bd',c2:'#bd5279',label:'SOFT\nBEAUTY',prompt:'Create a luxury beauty campaign from my reference photo. Keep facial identity and natural skin texture. Add elegant editorial makeup, soft peach background, floating perfume mist, macro close-ups, creamy highlights, slow graceful movement, premium cosmetics advertisement.'},
      {cat:'product',title:'Glass Bottle Universe',desc:'Брендовый продукт внутри миниатюрной вселенной из стекла.',tag:'BRAND',c1:'#042b35',c2:'#16c6a2',label:'GLASS\nUNIVERSE',prompt:'Create a premium advertising film for the product in my reference image. Place it inside a miniature glass universe with tiny planets, liquid reflections and volumetric light. Product remains sharp and readable. Elegant camera rotation, luxury brand art direction, clean final hero shot.'},
      {cat:'effects',title:'Mosaic Identity',desc:'Лицо и образ собираются из сотен светящихся фрагментов.',tag:'MOSAIC',size:'tall',c1:'#352172',c2:'#00b4d8',label:'MOSAIC\nSHIFT',prompt:'Animate my reference photo as a beautiful identity transformation. The image breaks into hundreds of luminous glass mosaic tiles, swirls through space, then reconstructs the same person in a new outfit. Preserve face, eyes and proportions. Smooth transition, controlled particles, cinematic lighting.'},
      {cat:'anime',title:'Anime Hero Transformation',desc:'Реальный портрет превращается в выразительного героя аниме.',tag:'ANIME',c1:'#ff6b4a',c2:'#301a78',label:'HERO\nMODE',prompt:'Transform the person in my reference photo into a high-quality anime hero while preserving recognizable facial features. Add wind-blown clothing, glowing energy, dynamic camera orbit and a dramatic sunset sky. Detailed cel shading, expressive eyes, cinematic action pose, consistent character design.'},
      {cat:'social',title:'Creator Product Review',desc:'UGC‑ролик для соцсетей: естественный ведущий и товар в кадре.',tag:'UGC',size:'square',c1:'#f2b54a',c2:'#e85c83',label:'CREATOR\nREVIEW',prompt:'Create a natural vertical UGC product review using my reference photo. The person holds and presents the product confidently, speaks directly to camera, authentic home lighting, handheld smartphone feel, clean lip sync, friendly energy, strong first-second hook, 9:16.'},
      {cat:'cinematic',title:'Desert Monument',desc:'Монументальная сцена с пылью, ветром и огромным масштабом.',tag:'EPIC',c1:'#d8874b',c2:'#351b34',label:'DESERT\nMONUMENT',prompt:'Place the subject from my photo in an epic desert landscape beside a monumental futuristic structure. Golden dust storm, vast scale, low-angle camera, fabric moving in the wind, warm sunset, subtle film grain, realistic textures, high-end science-fiction movie still.'}
    ];
    let active='all', query='', selected=null, favorites=JSON.parse(localStorage.getItem('seedance-favorites')||'[]'), onlyFav=false;
    const $=s=>document.querySelector(s);
    function renderNav(){ $('#nav').innerHTML=categories.map(([id,name,icon])=>`<button class="${active===id?'active':''}" data-cat="${id}">${icon} ${name}<span class="count">${id==='all'?items.length:items.filter(x=>x.cat===id).length}</span></button>`).join(''); }
    function renderChips(){ $('#chips').innerHTML=categories.map(([id,name])=>`<button class="chip ${active===id?'active':''}" data-cat="${id}">${name}</button>`).join(''); }
    function filtered(){return items.filter(x=>(active==='all'||x.cat===active)&&(!onlyFav||favorites.includes(x.title))&&(`${x.title} ${x.desc} ${x.tag} ${x.prompt}`.toLowerCase().includes(query.toLowerCase())))}
    function render(){renderNav();renderChips();const list=filtered();$('#gallery').innerHTML=list.length?list.map((x,i)=>`<article class="card" data-index="${items.indexOf(x)}"><div class="visual ${x.size||''}" style="--c1:${x.c1};--c2:${x.c2}"><span class="visual-sub">${x.tag}</span><div class="visual-label">${x.label.replace('\n','<br>')}</div></div><div class="card-body"><h3 class="card-title">${x.title}</h3><p class="card-desc">${x.desc}</p><div class="card-foot"><span class="tag">${x.cat}</span><button class="copy" data-copy="${items.indexOf(x)}">Copy prompt</button></div></div></article>`).join(''):`<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>`;}
    function open(item){selected=item;$('#modalTitle').textContent=item.title;$('#modalMeta').textContent=item.desc+' • '+item.tag;$('#modalPrompt').textContent=item.prompt;$('#modal').classList.add('open')}
    async function copy(text){try{await navigator.clipboard.writeText(text);alert('Промт скопирован ✅')}catch(e){prompt('Скопируй промт:',text)}}
    document.addEventListener('click',e=>{const cat=e.target.closest('[data-cat]');if(cat){active=cat.dataset.cat;onlyFav=false;render()}const card=e.target.closest('.card');if(card&&!e.target.closest('button'))open(items[+card.dataset.index]);const cp=e.target.closest('[data-copy]');if(cp){e.stopPropagation();copy(items[+cp.dataset.copy].prompt)}});
    $('#search').addEventListener('input',e=>{query=e.target.value;render()});$('#favoritesBtn').onclick=()=>{onlyFav=!onlyFav;active='all';render()};$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#modalCopy').onclick=()=>copy(selected.prompt);$('#modalUse').onclick=()=>{ $('#modal').classList.remove('open'); $('#file').click()};['uploadTop','uploadHero'].forEach(id=>$('#'+id).onclick=()=>$('#file').click());$('#file').onchange=e=>{if(e.target.files[0])alert('Фото выбрано ✅ Теперь скопируй промт и вставь его в Seedance вместе с фото.')};
    render();
  </script>
</body>
</html>
