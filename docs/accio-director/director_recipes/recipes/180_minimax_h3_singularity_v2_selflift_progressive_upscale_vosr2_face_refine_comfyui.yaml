prompts_verbatim:
- |-
  3 Flaws, 1 Workflow: Fix MiniMax H3 Skin, Motion & Resolution
  Tired of MiniMax H3 videos that look like shiny, plastic masks, move in floating slow-motion, and take forever to render in high resolution? 🎬 In this tutorial, we solve all three fatal flaws in a single, streamlined ComfyUI workflow!
  We combine the newly upgraded Singularity V2 base model (which natively expands motion dynamics and eliminates floating slow-mo without speed-correcting LoRAs) with the revolutionary SelfLift extension. SelfLift unifies low-res structural generation, 3D latent upscaling, and high-res refinement into a single, progressive sampling node!
  🔥 What you'll master in this tutorial:
  • 🧴 The Plastic Skin Cure: Why specular highlights accumulate over long clips and how Singularity V2 keeps skin matte and natural.
  • ⚡ Fixing Floating Slow-Mo: Achieving snappy, fast-paced action (bell-grabbing reflexes & rapid martial arts) with zero speed-modifying LoRAs.
  • 📐 SelfLift 1-Node Progressive Upscaling: Configuring lowres_scale: 0.4, transition_step: 4, and rho: 0 for seamless 1376x768 / 1.5M renders.
  • 🎛️ The Sol-Attn Window Hack: Why setting sparse attention to 0.2–0.9 eliminates end-stage noise artifacts.
  • 👤 Simplified Facial Restoration: Using YOLOv8 tracking + VOSR 2.0 at 1.0x scale (feature sharpening without resizing) for crystal-clear faces.
  • 🧪 Dynamic Motion Stress Tests: From gentle hair-tying to sudden fountain sprints and dual sword duels.

