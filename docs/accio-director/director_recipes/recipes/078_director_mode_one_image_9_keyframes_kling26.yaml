prompts_verbatim:
- |-
  1️⃣ THE "DIRECTOR MODE" PROMPT (Step 1)
  Copy and paste this into Nano Banana Pro to generate your initial analysis and storyboard structure.

  You are a professional film trailer director, cinematographer, and storyboard artist. Your task is to take ONE single reference image and expand it into a coherent, cinematic storyboard suitable for AI video generation.

  Before generating anything: First, carefully analyze the entire scene in the reference image. Identify: – All visible subjects (people, vehicles, animals, objects, environment) – Their positions, orientation, gaze direction, and interactions – The environment, time of day, and lighting style

  Important rules you must follow: – Do not guess identities or invent information – Do not add new characters or objects – Keep the same subjects, clothing, environment, time of day, and lighting across all shots – Only vary framing, camera angle, camera movement, and action – Maintain realistic cinematic logic: Wide shots = deeper depth of field Close-ups = shallower depth of field – Use a consistent cinematic color grade across all shots

  Your goal: Create a 20–50 second cinematic sequence with a clear narrative arc: Setup → Escalation → Turning Point → Resolution

  Output the following sections in this exact order:

  A) Scene Breakdown Describe subjects, environment, lighting, atmosphere, and visual anchors.

  B) Theme & Story Provide a concise theme, a cinematic logline, and a four-beat emotional arc.

  C) Cinematic Approach Explain shot progression, camera movement, lens choices, depth of field, and lighting strategy.

  D) Keyframe List Generate exactly 9 cinematic keyframes. Each keyframe must include: – Duration – Shot type – Composition – Action – Camera movement – Lens and depth of field – Lighting and color grade – Optional sound or atmosphere cue – Story dialogue or voice line

  Include at least: – One wide establishing shot – One intimate close-up – One extreme detail shot – One visually impactful angle (high or low)

  E) Master Storyboard Grid Create ONE 3×3 storyboard grid image containing all 9 keyframes. Label each panel with keyframe ID, shot type, and duration. After the grid, include a detailed textual breakdown of each keyframe.

  2️⃣ THE "FORCED GENERATION" PROMPT (Troubleshooting)
  If the AI writes the text but forgets to draw the image, simply reply with this:

  "generate the 3x3 grid image here based on the above keyframes" ;

  If the AI only generate image but no text ,add this before Section E (Master Storyboard Grid)::

  ONLY AFTER all text sections above are fully completed,
  generate ONE single master storyboard contact sheet image.

  3️⃣ THE EXTRACTION PROMPT (Step 2)
  Use this when isolating/upscaling a specific panel to ensure it stays 16:9 and full screen (Replace '1' with your desired frame number).

  "The keyframe 1 of the scene，16:9 aspect ratio, full frame, no letter boxing, no black bars"
