prompts_verbatim:
- "=== https://t.me/profiobzorov/1954 2026-08-11T15:27:04+00:00\nКАК СОХРАНИТЬ ВНЕШНОСТЬ ГЕРОЯ? \U0001F587\n\nКонечно, создать лист персонажа с разными эмоциями и ракурсами. Тогда при генерации видео, в\
  \ таких нейросетях, как Seedance, все внешние данные будут сохраняться. \n\nИНСТРУКЦИЯ:\n1️⃣ Переходим в:\n\U0001F4F1 ТГ БОТ SYNTX\n\n2️⃣ Главное меню ➡️ \U0001F3A8 Дизайн с ИИ ➡️ \U0001F34C Nano Banana\
  \ Pro. \n\n3️⃣ Загружаем ваше фото персонажа и отправляем промпт:\n \nЛист с эмоциями:\nИспользуй загруженное изображение только как референс личности. Перестрой человека в стандартизированный студийный\
  \ портрет по плечи, независимо от исходного кадрирования. Обрежь от уровня чуть ниже ключиц до чуть выше головы, чтобы голова занимала около 70-75% кадра. Никогда не генерируй портрет в полный рост, по\
  \ пояс, по грудь или по бедра. Создай один профессиональный лист выражений лица ровно с восемью портретами, расположенными в чистой сетке 4х2 на чистом белом однотонном фоне. Сохраняй одного и того же\
  \ человека идеально последовательным в каждом портрете, сохраняя идентичную индивидуальность лица, причёску, длину волос, тон кожи, пропорции лица, шею и одежду, видимую в области выреза горловины.\n\
  Сохраняй идентичное кадрирование, расстояние до камеры, освещение, цветокоррекцию и используй прямое анфас (0°). Может меняться только выражение лица. Выражения по порядку: нейтральное, лёгкая улыбка,\
  \ широкая улыбка с видимыми зубами, смех, удивление, гнев, печаль, подмигивание.\nФотореалистичный студийный портрет, объектив 85 мм, мягкое рассеянное освещение, ультрареалистичный,\nНегативный промт:\
  \ полный рост, по пояс, по грудь, крупный план, отдалённый кадр, другое кадрирование, другой человек, изменённое лицо, другая причёска, вид сбоку, профиль, поворот головы, непоследовательное освещение,\
  \ бьюти-фильтр, иллюстрация, аниме, cgi, размытость, текст,\nводяной знак.\n\nВнешность в разных ракурсах:\nИспользуя прикрепленное изображение в качестве строгого референса, создай чистый вертикальный\
  \ лист персонажа 9:16 на белом студийном фоне. Без текста, без подписей, без водяных знаков, без элементов интерфейса.\nСохраняй одного и того же человека во всех панелях: одинаковое лицо, волосы, тон\
  \ кожи, пропорции тела, наряд, аксессуары, обувь и общий внешний вид. Не меняй возраст, этническую принадлежность, прическу и индивидуальность. \nсоздай 8 панелей в чистом макете: \nВерхний ряд:\n\uFEFF\
  \uFEFF\uFEFF1. полный рост, вид спереди\n\uFEFF\uFEFF\uFEFF2. полный рост, вид сбоку (профиль)\n\uFEFF\uFEFF\uFEFF3. полный рост, вид сзади\n\uFEFF\uFEFF\uFEFF4. полный рост, вид в ¾ \nСредний ряд:\n\uFEFF\
  \uFEFF\uFEFF1. крупный портрет спереди\n\uFEFF\uFEFF\uFEFF2. крупный портрет сбоку (профиль) \nНижний ряд:\n\uFEFF\uFEFF\uFEFF1. крупный план затылка / волос\n\uFEFF\uFEFF\uFEFF2. крупный портрет в 3/4\n\
  Стиль: фотореалистичный, чистое студийное освещение, резкий фокус, реалистичная текстура кожи, премиальный модный образ, минималистичный фон, высокая согласованность индивидуальности во всех панелях.\n\
  \n4️⃣Сохраняем получившиеся коллажи и дальше используем во всех генерациях с этим героем, это супер удобно. Теперь-то внешность точно не поплывёт! \n\nСохраняй полезняшку и делись с другими✈️\n\n✔️ Подписывайтесь\
