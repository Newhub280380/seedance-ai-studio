- "Workflow: [github.com/Comfy-Org/workflow\\_templates/blob/main/templates/video\\_minimax\\_h3\\_r2v.json](http://github.com/Comfy-Org/workflow_templates/blob/main/templates/video_minimax_h3_r2v.json)\n\
  \nUsed multiple reference images for each scene.\n\n**Prompt For Multi Character:**  \n*subject\\_definitions:*\n\n*<Subject 1> is \\[CHARACTER 1\\] from <Picture 1>, preserving the visual identity, costume,\
