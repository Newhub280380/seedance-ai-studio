  \ the scene. The three hold a poised, united stance as the portal flickers and golden particles drift around them. Their expressions and body language remain confident and appropriate to their individual\
  \ character identities.*\n\n*overall\\_soundscape:*\n\n*Low portal hum, soft wind, subtle movement from clothing or equipment, and drifting golden sparks. No speech.*\n\n\n\n*non\\_diegetic\\_music:*\n\
  \n*A restrained cinematic rise builds across the shot and resolves on a calm, confident note.*\n\n**Prompt For single characters:**  \n*subject\\_definitions:*\n\n*<Subject 1> is \\[CHARACTER\\] from\
  \ <Picture 1>, preserving the visual identity, costume, proportions, accessories, and visual style shown in the reference image.*\n\n*summary:*\n\n*\\[reference generation\\] A 5-second cinematic multiverse\
  \ portal arrival. One character walks through a consistent amber-orange portal, then takes a confident action stance with a subtle grin.*\n\n*retention\\_analysis:*\n\n*<Subject 1> (appears in \\[Shot\
  \ 1\\] and \\[Shot 2\\]): fully\\_preserved - retains the identity, costume, proportions, accessories, and visual style shown in <Picture 1>.*\n\n*detailed\\_description:*\n\n*A 5-second cinematic portal-arrival\
  \ scene at dusk. No dialogue, no crowd, no wide landscape, and no combat.*\n\n*Portal continuity: a large circular amber-orange portal stands behind <Subject 1>. It has a bright fiery rotating outer ring,\
  \ a darker transparent centre, floating gold sparks, gentle smoke, and a low resonant hum. Keep its colour, size, brightness, particle density, and rotation speed consistent across every portal-arrival\
  \ clip.*\n\n*\\[Shot 1\\] Medium knee-up shot. <Subject 1> walks steadily through the portal toward the camera, then comes to a composed stop. Their costume, silhouette, movement style, and any character-specific\
  \ accessories remain fully consistent with <Picture 1>. Golden sparks drift around them as the portal flickers behind.*\n\n*\\[Shot 2\\] Close-up of <Subject 1>. They shift into a distinctive, character-appropriate\
  \ action stance, looking directly ahead with calm confidence. Their expression changes into a subtle smile and restrained grin. Keep the movement natural and controlled, with no exaggerated facial distortion.\
  \ The portal remains softly visible and out of focus in the background.*\n\n*overall\\_soundscape:*\n\n*Low portal hum, soft wind, subtle movement from clothing or equipment, and drifting golden sparks.\
  \ No speech.*\n\n*non\\_diegetic\\_music:*\n\n*A restrained cinematic rise builds through the entrance and resolves as <Subject 1> holds the final stance.*"
