  \ image.*\n\n*summary:*\n\n*\\[reference generation\\] A 5-second cinematic multiverse portal arrival. Three characters emerge from a consistent amber-orange portal and take a calm, confident formation.*\n\
  \n*retention\\_analysis:*\n\n*<Subject 1> (appears in \\[Shot 1\\]): fully\\_preserved - retains the identity, costume, proportions, accessories, and visual style shown in <Picture 1>.*\n\n*<Subject 2>\
  \ (appears in \\[Shot 1\\]): fully\\_preserved - retains the identity, costume, proportions, accessories, and visual style shown in <Picture 2>.*\n\n*<Subject 3> (appears in \\[Shot 1\\]): fully\\_preserved\
  \ - retains the identity, costume, proportions, accessories, and visual style shown in <Picture 3>.*\n\n*detailed\\_description:*\n\n*A 5-second cinematic portal-arrival scene at dusk. One stable medium\
  \ three-shot, framed from the knees up. No dialogue, no combat, no wide landscape, no camera movement, and no crowd.*\n\n*Portal continuity: a large circular amber-orange portal stands behind the characters.\
  \ It has a bright rotating outer ring, a darker transparent centre, floating gold sparks, gentle smoke, and a low resonant hum. Keep its colour, size, brightness, particle density, and rotation speed\
  \ consistent across every portal-arrival clip.*\n\n*\\[Shot 1\\] <Subject 1> steps through the portal first and takes the centre position with quiet confidence. <Subject 2> emerges on one side, naturally\
