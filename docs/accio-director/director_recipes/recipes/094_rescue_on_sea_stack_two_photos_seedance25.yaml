prompts_verbatim:
- |-
  === https://t.me/veo3prompts/2740 2026-10-15T11:27:26+00:00
  Спасаем того, кто дорог

  Загружайте свои 2 фото с промптом ниже.

  Переходите в бот, /start -> выбор модели -> Seedance 2.5 480p -> генерация по фото -> формат 9:16 -> 19 секунд.


  <Climber> corresponds to @Image 1. <Survivor> corresponds to @Image 2.
  @Image 1 and @Image 2 define each character's face, identity, age, body proportions, hairstyle and exact outfit (colors, fabrics, accessories, footwear). Do not use the image backgrounds. Keep faces and outfits identical in every shot; do not change, restyle or invent clothing.

  Format: 9:16 vertical, 19 seconds. Style: cinematic photorealism, anamorphic film look, shallow depth of field, subtle film grain.

  Scene: a tall isolated sea stack of hexagonal basalt columns rising from a stormy ocean. Heavy overcast, dark grey clouds, light rain, strong wind, white-capped waves crashing at the base. Wet glossy black basalt with cracks and puddles. Cold desaturated teal-grey grade; characters' clothing keeps its natural reference colors. <Climber>'s hair and clothes are wet and windswept, rain droplets and tears on skin. <Survivor> is frightened at the very edge of the top.

  0–2s: Extreme close-up, slight handheld. <Climber>'s wet hand grips a crack in the basalt and pulls up; above, <Survivor>'s hand clings to the rock edge. Slow tilt up the rock face.

  2–4s: Close-up of <Climber>'s face looking up, crying, tears mixing with rain, brows knitted in fear, lips trembling. Static, soft dark sea behind.

  4–6s: Low angle from below the edge. <Survivor> leans over the edge on all fours, scared, lip quivering, reaching one hand down toward camera, overcast sky behind. Slow push-in.

  6–8s: Macro close-up. <Climber>'s hand firmly clasps <Survivor>'s hand at the sleeve against the wet rock, water droplets in sharp detail. Static.

  8–11s: Wide side profile, full body. <Climber> climbs the final ledge of the column, arm stretched up holding <Survivor>'s hand as <Survivor> leans down from the top; stormy sea and horizon behind. Slow lateral dolly following the ascent.

  11–14s: Close-up embrace. <Climber> hugs <Survivor> tightly, cheek pressed to <Survivor>'s head, eyes closed, sobbing with relief; <Survivor>'s hand grips <Climber>'s shoulder. Gentle handheld drift, slight slow motion.

  14–19s: Aerial drone, wide, centered. Tiny figures of <Climber> and <Survivor> sitting together on top of the sea stack, embracing; waves crash around the base. The clouds part and warm golden god rays break through and light the pair. Slow drone pull-back and rise; light shifts from cold grey to warm gold.

  Audio: slow emotional cinematic piano with swelling strings, building to a hopeful crescendo in the final shot. SFX: wind gusts, rain, crashing waves, heavy breathing, soft sobbing. No dialogue, no subtitles, no on-screen text.

  Avoid: face or outfit changing between shots, extra or deformed fingers, distorted faces, cartoon or CGI look, oversaturation, watermark, logo, anyone falling, injury, blood.


  Сгенерировать можно тут: @Veo3_official_bot(Seedance 2.5)

  Veo3 | Banana News
