prompts_verbatim:
- "=== https://t.me/nercpa/307 2026-10-18T07:45:06+00:00\n\U0001F3AEКонец рабочего дня в стиле GTA\n\n1. Заходите в бота @neyrosetkabot\n2. Выбираете ваше фото в хорошем качестве \n3. Выбираете режим Видео\
