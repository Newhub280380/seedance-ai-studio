  action: 'Nano Banana Pro: загрузить фото объекта + промпт exploded view (у автора под часы, слово Rolex/watch заменить на свой объект).'
  tool:
  - Nano Banana
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: user_input
  duration: unknown
  aspect: unknown
- n: 2
  action: 'Kling 2.5 Turbo (в посте заголовок про Veo 3.1, но шаг 2 у автора — Kling 2.5 Turbo): режим первый+последний кадр. Первый кадр = exploded-картинка из шага 1, второй (последний) кадр = исходное
    фото. Промпт сборки.'
  tool:
  - Kling
  - Veo
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: last_frame
  duration: unknown
  aspect: unknown
- n: 3
  action: 'Результат: короткий ролик сборки. Можно склеить «разбор → сборка».'
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: previous_step_output
  duration: unknown
  aspect: unknown
