use_when: 'Из одного фото товара (у автора часы Rolex на руке) делается кадр «взрыв-схемы»: все детали разлетелись, но ракурс и фон те же. Потом Kling анимирует переход от разобранного к собранному, где
  первый кадр = exploded view, последний = исходное фото. Получается вирусный ролик «товар собирается из детал'
inputs:
- фото товара/продукта
- стартовый кадр
- финальный кадр
