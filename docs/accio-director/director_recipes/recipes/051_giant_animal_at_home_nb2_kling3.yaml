prompts_verbatim:
- |-
  🧘‍♂️Как создать трендовое видео с лошадью?

  Переходим в БОТ PromptX

  Шаг 1: Работа с изображениями - Nano Banana 2, загружаем свое селфи фото и этот промпт:
  Используй моё фото за основу. Фотореалистичное вертикальное фото 9:16, эстетика Pinterest lifestyle, выглядит как реальный снимок на заднюю камеру iPhone 16 Pro. Строго без AI-ретуши, без «пластика», без сглаживания — натуральная текстура кожи, ткани, шерсти животного, лёгкое натуральное зерно, эффект случайного живого момента. В кадре девушка с референс-фото, со своими чертами лица и внешностью. Локация: современная кухня с белыми стенами и кухонным гарнитуром в тёплых коричневато-кофейных оттенках, виден проход, лёгкий беспорядок (тетрадь, ручка, кружка), живая домашняя атмосфера. Свет из окна: солнечный, мягкий, падает на девушку и часть комнаты. Сюжет: девушка сидит слева за столом на стуле, печатает на ноутбуке MacBook. Рядом с ней, чуть правее у прохода, стоит огромный жираф. Жираф максимально реалистичный, как живой: детализированная пятнистая шерсть, длинные ресницы, уши, спокойная морда, естественные тени на теле. Он такой большой, что его голова упирается в потолок, шея слегка наклонена, морда видна полностью. Атмосфера спокойная, домашняя, слегка сюрреалистичная, но максимально реалистичная. Девушка стройная. Волосы в точности как в референте, несколько прядей спадают на лицо. Одежда: чёрный топ бандо, широкие атласные штаны в стиле Y2K (очень широкие, свободные). Босиком. Освещение: мягкий ровный солнечный свет, тёплый, нейтральный, без жёстких теней. Лицо в точности как на фото-референсе. Максимум реализма, живые тени, без сглаживания. Кадр выглядит как случайное живое фото.
  Шаг 2: Теперь чтобы сделать такое видео, находим раздел "Создать" и выбираем там "Видео", далее выбираем "Kling 3.0", загружаем фото (из ШАГ 1) и пишем такой промпт:
  Создай атмосферу живого момента. Девушка за ноутбуком плавно печатает, её руки слегка двигаются, волосы чуть колышутся. Лошадь стоит спокойно, её бока слегка поднимаются и опускаются от дыхания. Лошадь также медленно и плавно поворачивает голову в сторону девушки (небольшой угол) и слегка дёргает ухом. Общий темп очень замедленный, медитативный, естественный, как в реальной жизни. Без резких движений. Крупный план, реализм, мягкое освещение.
  *Обязательно выбираем длительность видео не менее 10секунд.
  👉СОЗДАТЬ ФОТО

  🟢VPN в обход белых списков

  🤖 Генерировать такой контент можно здесь:➡️ PromptX
