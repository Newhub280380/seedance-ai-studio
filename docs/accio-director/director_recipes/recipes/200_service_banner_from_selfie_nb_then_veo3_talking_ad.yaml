prompts_verbatim:
- "Сделай вертикальный рекламный баннер для услуги “Садовник / Уход за участком”. Используй моё прикреплённое фото как референс человека и сохрани узнаваемость лица один в один, не ретушируй и не сглаживай..\
  \ Девушка по центру кадра по пояс, в чистой рабочей одежде садовника: зелёная/оливковая рубашка-поло или куртка, перчатки, аккуратный фартук. В руках — профессиональный секатор и небольшая ветка с зелёными\
  \ листьями (или ручной кусторез), поза уверенная, дружелюбная. Фон: ухоженный сад/участок с газоном, кустами и деревьями, всё сильно размыто (мягкое боке), солнечный мягкий свет, ощущение свежести. Добавь\
  \ лёгкие декоративные элементы “свежесть”: мягкие световые блики, маленькие листья на переднем плане, тонкий зелёный glow, но без перегруза. Стиль: фотореализм + современная рекламная графика, высокая\
  \ резкость на человеке и инструменте, чистая цветокоррекция (зелёные и тёплые оттенки), премиальный коммерческий вид.\n\nТекст и верстка как у профессионального промо-баннера:  \n— Сверху крупный заголовок\
  \ капсом: “САДОВНИК” (зелёный).  \n— Подзаголовок: “Стрижка, обрезка, уход за участком” (тёмно-серый).  \n— Слева 3 белых скруглённых блока с иконками и текстом:  \n1) “Стрижка газона”  \n2) “Обрезка\
  \ деревьев и кустов”  \n3) “Уборка участка”  \n— Внизу большая оранжевая кнопка со скруглениями: “ЗАКАЗАТЬ ВЫЕЗД”.  \nТипографика ровная, без ошибок, хорошая читаемость, правильные отступы и сетка. Итог\
  \ — чистый современный коммерческий дизайн, без логотипов и водяных знаков."
- |-
  низкое качество, шум, артефакты, кривой/нечитаемый текст, ошибки в словах, размазанные глаза, искажённые руки, лишние пальцы, неправильные инструменты, лишние предметы, водяные знаки, логотипы, мультяшность
- |-
  Очень реалистичное видео, крупный план. Камера статичная, лёгкая глубина резкости, кинематографичная цветокоррекция. Девушка говорит, чёткая артикуляция, синхронизация губ, уверенный дружелюбный тон. Лёгкие естественные движения: микромимика, редкое моргание, небольшой кивок, минимальные повороты головы, спокойное дыхание.
  Говорит на русском языке: «Привет! Я Саша. Сделаю аккуратную тату. Индивидуальный эскиз и ровные линии»
  Ultra realistic, 4K, 24 fps, natural motion.
