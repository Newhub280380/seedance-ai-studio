prompts_verbatim:
- |-
  I've been making short AI films and got tired of jumping between 5 different workflows, so I combined the whole pipeline into one modular workflow. Here's how it's structured, in case it's useful for your own setups:

  **1. Character sheets (Krea-2 Turbo):** front, side, back and close-up views of the same character, used later as references for consistency.

  **2. 360° environments (Qwen-Image 2512 + 360 LoRAs):** equirectangular panoramas, so you can crop different camera angles from the same location and keep backgrounds consistent between shots.

  **3. Multi-character composition (Qwen Rapid AIO):** places specific characters into the environment while keeping their faces intact.

  **4. Video (MiniMax H3):** I2V, reference-to-video and T2V, with 32kHz stereo audio (ambience, voice, SFX) generated in the same pass.

  **5. Upscale:**

  * Two-stage latent upscale 768p → 2K with short-sigma refinement (3–5 steps). It sharpens skin and fabric texture without changing motion or identity.
  * Temporal chunking enabled to avoid OOM on consumer GPUs with long sequences.
  * Optional SeedVR2 pass for the final upscale.

  **It took me 1 day to prepare a complete 3 minute minidrama episode from scratch!**

  Video Tutorial: [https://www.youtube.com/watch?v=rMR7VFXL8WY](https://www.youtube.com/watch?v=rMR7VFXL8WY)

  **The workflow** is in the Youtube video description
