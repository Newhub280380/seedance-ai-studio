  03 — PERMANENT ESCALATOR ENVIRONMENT
  ━━━━━━━━━━━━━━━━━━━━━━━━
  Create a realistic modern indoor inclined escalator.
  The escalator is a physically ascending mechanical staircase, not a horizontal moving walkway.
  The central moving staircase contains precisely constructed silver-gray aluminum steps with dense parallel ribbed grooves, dark recessed risers, narrow black mechanical gaps and thin yellow safety markings along both sides.
  The metallic steps have realistic industrial texture, subtle wear, dimensional shadows and controlled reflections.
  Both sides contain brushed stainless-steel panels, dark handrails and transparent glass balustrades.
  The escalator runs vertically through the 9:16 composition.
  The left and right handrails establish the visual boundaries of the frame.
  Do not reveal large surrounding areas beyond the handrails.
