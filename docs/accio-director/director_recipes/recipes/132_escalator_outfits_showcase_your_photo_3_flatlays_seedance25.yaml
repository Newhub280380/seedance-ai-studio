  The escalator continuously moves UPWARD from the bottom of the image toward the top.
  Maintain a constant moderate speed throughout all 13 seconds.
  The movement is smooth, mechanically realistic and suitable for fashion presentation.
  The fixed side structures remain stationary.
  Each appearance of the model is physically seated on a specific moving step.
  The pelvis is naturally supported by the step.
  Legs, footwear, hands and accessories interact realistically with the supporting steps.
  The model and the supporting steps move upward at exactly the same speed.
  The body remains attached to its supporting step as it passes through the frame.
  No independent vertical drifting, no floating, no hovering, no sliding across steps, no sudden changes of movement speed.
  Maintain realistic gravity, body weight, contact shadows and fabric compression.
  ESCALATOR STEP CONTINUITY:
  Preserve the exact same physical escalator steps and their ribbed metallic textures continuously from the first frame to the last.
  Every step moves upward along one uninterrupted mechanical trajectory.
  The spacing, geometry, yellow edge markings, dark risers and ribbed metal patterns remain temporally consistent.
  Never regenerate, redraw, replace, reshape or reposition the escalator steps between consecutive frames.
  No texture popping, no step-pattern resets, no visual jumps in the escalator structure.
  ━━━━━━━━━━━━━━━━━━━━━━━━
  06 — THREE DISTINCT LUXURY FASHION POSES
