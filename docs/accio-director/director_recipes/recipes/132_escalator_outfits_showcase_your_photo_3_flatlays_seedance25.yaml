  This angle allows the model's face to be naturally visible from the beginning of each appearance without dramatic head movement.
  The camera is centered along the escalator axis.
  Position the camera slightly farther back than a tightly cropped overhead shot, but close enough to maintain recognizable facial details and clear wardrobe readability.
  Keep the full seated figure and the complete outfit visible during the main central portion of each appearance.
