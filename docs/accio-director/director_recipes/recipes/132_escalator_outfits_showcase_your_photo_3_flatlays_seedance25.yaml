  AUDIO RULE — ABSOLUTELY NO MUSIC OR PRE-RECORDED AUDIO TRACKS.
  No soundtrack, no background or ambient music, no melody, no beat, no percussion, no cinematic score, no stock audio, no singing, no vocals, no dialogue, no speech, no voiceover, no narration.
