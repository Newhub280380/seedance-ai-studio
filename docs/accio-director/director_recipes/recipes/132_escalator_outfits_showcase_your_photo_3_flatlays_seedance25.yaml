  Each appearance has a clearly different premium fashion editorial pose.
  The poses are naturally elegant, confidently relaxed and physically realistic.
  Every appearance enters already positioned in its assigned pose.
  POSE ONE — DIAGONAL EDITORIAL:
  A relaxed diagonal seated pose.
  The torso is slightly rotated.
  One leg extends naturally along the steps while the other remains bent or casually crossed.
  The arms create an asymmetric, sophisticated silhouette.
  The pose feels confident, relaxed and effortlessly fashionable.
  POSE TWO — ASYMMETRIC FASHION LEAN:
  A distinctly different seated composition.
  The torso gently leans backward or sideways with natural support from one arm.
  One knee is positioned differently, creating a more sculptural, asymmetric leg arrangement.
  The pose feels expressive, refined and fashion-forward.
  POSE THREE — ELEGANT SEMI-RECLINED:
  A third visually different semi-reclined editorial pose.
  The pelvis remains fully supported.
  The torso and legs create an elegant relaxed silhouette, clearly distinct from the previous two poses.
  One arm rests naturally while the other contributes to a sophisticated fashion composition.
