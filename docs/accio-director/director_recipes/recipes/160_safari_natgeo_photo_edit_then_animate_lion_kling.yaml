prompts_verbatim:
- "=== https://t.me/vse_ai/38 2026-06-24T13:31:36+00:00\n\U0001F514 А что, если оказаться героем фильма National Geographic?\n\nИз обычной фотографии можно сделать кадр, будто вы участвуете в настоящей\
  \ сафари-экспедиции ☀️\n\nЛьвы проходят рядом.\nСлоны идут по саванне.\nЗакатное солнце пробивается сквозь пыль.\n\nА затем всё это можно оживить и превратить в кинематографичное видео \U0001F3AC\n\n\
  Делается в 2 шага ⤵️\n\n1️⃣ Создаем изображение\n\n\U0001F4CC Работа с фото → Изменить фото\n\nВставьте этот промпт:\n\nПревратить фотографию человека в кинематографичный кадр дикой природы в стиле дорогого\
  \ сафари-документального фильма.\n\nЧеловек находится в африканской саванне среди высокой золотистой травы. Теплый закатный свет, объемные солнечные лучи, атмосфера настоящего сафари.\n\nРядом реалистичные\
  \ дикие животные: львы, слоны, жирафы и зебры.\n\nСохранить узнаваемость лица человека.\n\nМаксимальный фотореализм, натуральные цвета, реалистичный свет, атмосфера дорогой экспедиции National Geographic.\n\
  \n2️⃣ Оживляем изображение\n\n\U0001F4CC Оживить фото → следуем шагам\n\nВставьте этот промпт:\n\nСоздать ощущение, будто человек оказался внутри настоящего сафари-фильма.\n\nОгромный лев проходит рядом\
  \ с камерой на переднем плане.\n\nВдали идут слоны.\n\nВетер двигает траву.\n\nВ воздухе видна солнечная пыль.\n\nКадр выглядит как момент из дорогой экспедиции Netflix Earth.\n\nСверхреалистично, эмоционально,\
  \ эпично, cinematic wildlife shot.\n\n\U0001F525 Результат выглядит так, будто вас случайно сняли во время дорогой сафари-экспедиции.\n\n⚡️ Повторить можно здесь:\n\n\U0001F449 @kling_tgbot\n\U0001F449\
  \ @kling_tgbot\n\U0001F449 @kling_tgbot\n  \n    Please open Telegram to view this post\n    VIEW IN TELEGRAM\n  \n\n  \n    Please open Telegram to view this post\n    VIEW IN TELEGRAM"
