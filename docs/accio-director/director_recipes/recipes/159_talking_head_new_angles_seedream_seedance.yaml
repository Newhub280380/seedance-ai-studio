prompts_verbatim:
- |-
  Jerrod Lew built a workflow in Magnific Spaces that turns one talking-head clip into new camera angles.

  The steps from his tutorial. Gemini 3.5 Flash describes the first frame in one paragraph. Seedream 5.0 re-shoots that frame from three positions, from a 24mm wide at eye height to a 50mm close-up from below. Same person, pose, clothes, location and light, only the camera moves. Seedance 2.5 then gets one of those stills as reference. The source clip goes in as video reference and drives the motion, with the first-frame slot left empty.

  So the motion comes from the source and the camera from the still. For an editor that's a second camera on a shot that only had one.

  The cut between angles is where it gets tested, and he shows the limits himself. Some motions don't match, and lip sync can drift. On a talking head the cuts often fall on the words, so drift shows on the first cut to a close-up. I'd keep the source angle for the lines that matter and use the new angles on pauses and reactions.

  In his setup the Seedance pass is 10 seconds at 720p with no sound. The source audio stays the master track and every new angle has to sync back to it.
