prompts_verbatim:
- |-
  == ai_chuhai 2113428504347812079 conv 2113428504347812079 2026-10-23T00:33:15.000Z
  # Image-to-Video Long Take · iLang IML v1.0

  ## Perception — extract from input image before generating
  Scan the input image and lock these constants. All downstream decisions reference them.
  - **Palette**: dominant hues, saturation range, light source direction and quality
  - **Anchor**: primary subject position, pose, facing; negative space distribution
  - **Named anchors**: secondary objects that must follow continuity rules (exit frame naturally if camera pushes past; never vanish, never reappear)
  - **Emotion**: three words for opening mood
  - **Emotion end**: three words for closing mood (arc must be monotonic, no reversal)
  - **Tension**: what is about to happen — the single dramatic thread
  - **Frame start**: subject scale as % of frame height
  - **Camera**: locked position relative to subject (never orbit, pan, tilt, or shake)

  Constants are immutable once extracted. Perception wrong → everything downstream wrong.

  ## Judgment — acceptance criteria
- |-
  Any rule fails → reject that segment, regenerate. Never stitch a failed segment.
  "Return to stillness" = motion stops at current framing. Not a pullback to opening wide shot. To pull back, revise J1 first.

  ## Execution
  - 3 segments × 10s = 30s total. Input image = Seg1 frame 0
  - Each next segment's input = actual last frame of previous segment (not snapshot, not original image)
  - Before generating: extract previous segment's last frame. After generating: sample first and last frame of new segment, verify J4 before continuing
  - Seg1: 3s static → slow push. Seg2: continuous push. Seg3: push decelerates → 5s static hold
  - Camera: locked angle, forward movement only
  - Ambient motion (smoke, particles, clouds) stays at or below first-frame intensity — no new sources, no explosions, no added objects
  - Named anchors exit frame naturally with push; do not delete or teleport them
  - Stitch: ffmpeg hard concat, 960×960, 24fps, h264, no transitions

  ## Output
  Deliver stitched video + generation log:
  - Total segments generated, rejected count, which rule each rejection violated
  - Stitch quality: visual continuity or jump cut (never claim pixel-identical — generated frames are never pixel-identical)
  - Note any difference between final frame and opening composition
