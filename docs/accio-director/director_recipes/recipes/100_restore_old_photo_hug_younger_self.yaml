prompts_verbatim:
- |-
  ##### restore-and-hug-younger-self | Restore an old photo and hug your younger self
  What you provide
  The old photo (image)
  Who you are today (or upload a photo of you now) (text)
  What Sensei does
  The old photo restored, the face kept
  You today, hugging your younger self
  One tender 6-second shot from the photo to the hug
  The brief Sensei follows
  Restore the old photo {{old-photo}} with one edit (gpt-image-2-edit): remove creases, cracks, scratches, dust, torn edges and the border, correct the faded colour and sharpen it, the face, hair and clothes kept exactly the same. Then make a still on Seedream 5 with the restored photo as the reference: the same person then, embracing themself today ({{today}}), cheek to cheek in the same place, warm light. Check both faces against the photos with pixeldojo_look. Then make a 6-second Seedance 2.5 shot at 1080p with the restored photo as the first frame and the embrace as the last frame: the older self walks in from the side and they hug, one continuous tender shot, soft piano and natural ambience.
