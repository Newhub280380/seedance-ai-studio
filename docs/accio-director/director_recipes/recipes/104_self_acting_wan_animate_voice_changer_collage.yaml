prompts_verbatim:
- |-
  And inside the prompt, what I'll tell it to do is create a photo inside a film of the blue woman sitting down in the same pose as the man.

  We'll be using photo animate where I'll be taking that recording of myself and transferring the movements onto my AI character.

  One thing to know is that right now you can do up to 15 seconds of the motion capture.

  And I'd also recommend using a pro mode for the best quality results.

  Otherwise, you'll get this error that says the face is too small.

  They have this AI voice changer.

  Uh I like this one called Britney, the female villain, and then use AI to change my voice.

  So, in the video uh tab on OpenArt, if I go to lip sync video, I can actually animate uh image of my character talking with just a single audio file.

  And this is the collage method where we're going to put multiple references of different characters all into the same image.

  I'll say, create a photo inside a film of the blue woman holding a blaster inside a spaceship.

  So, you want to make sure you're clear about the physical relationship between the characters.

  And at the end, I'm putting in a couple of style keywords, uh muted colors, cinematic sci-fi film.

  If you want to create wide landscape horizontal images, you need to make sure your reference photo is also a wide landscape horizontal image.

  Inside the prompt, I can ask for a different camera angle like creating a bird's-eye view shot of this scene.

  I actually played around a bit with the Kling 2.5 Turbo model.

  So, I'll tell it to follow the spacecraft flying through a space battle in a sci-fi film.

  Uh let's also make this a 10-second video, actually, just for good measure.

  The upscaler they're using is the Topaz AI upscaler.

  We have the option to do a 4K upscale, um also frame interpolation.
