title: '# 81 — Вставить себя в сцену из фильма: стоп-кадр + своё фото → Nano Banana Pro → Kling 3.0 / Seedance 2.5 (@Video1 повторяет камеру и темп сцены)'
intent_tags:
- client_in_clip
- seamless_series
- motion_transfer
use_when: '# 81 — Вставить себя в сцену из фильма: стоп-кадр + своё фото → Nano Banana Pro → Kling 3.0 / Seedance 2.5 (@Video1 повторяет камеру и темп сцены)'
inputs:
- стартовый кадр
- аудио/голос
steps:
- n: 1
  action: Стоп-кадр сцены **без узнаваемых лиц** (локация, план со спины, силуэт) — иначе модерация отклоняет.
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: user_input
  duration: unknown
  aspect: unknown
- n: 2
  action: "Nano Banana Pro, стоп-кадр + своё фото, 21:9:\n   `Помести человека с первого фото в сцену со второго изображения: он стоит у окна справа и смотрит на улицу. Свет, зерно и цветокоррекция как\
    \ в исходном кадре, формат 21:9.`\n   Поломки лица/рук править тем же кадром отдельным запросом, сцену заново не генерировать."
  tool:
  - Nano Banana
  mode: unknown
  prompt: unknown
  input_source: unknown
  duration: unknown
  aspect: '21:9'
- n: 3
  action: "a) Только кадр: стартовым кадром в Kling 3.0 (3–15 с) или Seedance 2.5 («Кадры», 4–30 с).\n   b) Кадр + подача сцены: Seedance 2.5 → «Референсы», задача «Референс», фрагмент фильма + свой кадр:\n\
    \   `Повтори движение камеры и темп из @Video1: медленный наезд, затем панорама вправо. В кадре человек с @Image1, ночной дождь, неоновые отражения, формат 21:9.`"
  tool:
  - Seedance
  - Kling
  mode: unknown
  prompt: unknown
  input_source: previous_step_output
  duration: 3–15 с
  aspect: '21:9'
- n: 4
  action: 'Отладка на 480p, финал 720p/1080p; длинную сцену бить на 2–3 плана; реплика — @Audio1 или Kling Avatars v2 для крупного плана.

    Шаблоны оттуда же: `Сцена как в @Video1, но герой — человек с @Image1, одежда с @Image2, музыка @Audio1, формат 9:16.` / для Kling Motion Control, если нужен новый фон: `Тот же персонаж, ночная улица
    с неоновыми вывесками, мокрый асфальт, мягкий контровой свет.` Правило Motion Control: крупность и поза на фото = первому кадру видео; «По видео» до 30 с, «По изображению» до 10 с.'
  tool:
  - Kling
  mode: Motion Control
  prompt: unknown
  input_source: unknown
  duration: 30 с
  aspect: '9:16'
prompts_verbatim:
- |-
  Используй загруженный кадр из фильма как основу сцены. Добавь меня в этот кадр максимально органично, как будто я изначально был частью фильма. Сохрани оригинальную композицию, освещение, цветокоррекцию, зернистость, стиль съёмки, атмосферу, эпоху, объектив и кинематографичный вайб сцены. Подбери мне одежду, причёску и общий внешний вид, идеально подходящие под стиль, время и эстетику этого фильма и конкретной сцены. Моя внешность должна быть узнаваемой и естественной, без искажений лица или пропорций. Не изменяй существующих персонажей, их внешность, позы, эмоции, одежду и расположение в кадре. Не меняй фон, декорации и композицию сцены. Просто реалистично встрой меня в кадр так, будто я всегда находился рядом с персонажами и участвовал в этой сцене. Максимальный фотореализм, seamless integration, cinematic realism, natural shadows
