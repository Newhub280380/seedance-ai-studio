  5s, the knight's sharp breath and cough at 12s, the scrape of the sword lifting from the grass, the animal's loud fierce call at 15s, then fast footsteps splashing through wet grass, armor clinking, and the wind rushing past. No music, no speech.

  Avoid: text, subtitles, watermark, gore, blood, cartoon or toy look, CGI look, video-game look, reference-sheet layout, studio background, multiple copies of a character, face or outfit changes, a different animal or breed than @Image 1, the animal changing size, the animal speaking, helmets, visors, covered heads, everyday clothes instead of armor, extra animals, extra knights, the knight standing before 13s, the animal dropping the sword, frozen frames, exaggerated expressions, slow motion, shaky camera outside the running shot.
