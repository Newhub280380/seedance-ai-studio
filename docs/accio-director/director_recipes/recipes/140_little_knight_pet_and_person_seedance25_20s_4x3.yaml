  ### comments nercpa/300
  --- Нейросетка |Промты | Обновления Chat
  A high-budget feature film shot on an ARRI Alexa with vintage spherical prime lenses and a 35mm film look, 4:3, photoreal. Everything was filmed for real on location by a professional crew: real light, real weather, real depth of field, motivated camera moves on dolly, crane, Steadicam and drone. Cold misty early-morning light, soft overcast sky, a desaturated palette of cool greens and greys with the red cape as the only strong color. Real-time speed.

  REFERENCES
  @Image 1 = the animal knight: any real animal. Keep its exact species, breed, size, body shape, fur or feathers, colors and markings, eyes, ears, face, and any accessory it wears (a bow, a collar). It stays its real natural size relative to the person.
  @Image 2 = the human knight: exact face, facial structure, eyes, brows, nose, lips, skin tone, apparent age and gender, hairstyle, hair length and color, body build. The person may be anyone — a man or a woman, young or old; the body and height match @Image 2. If @Image 2 shows only the face or upper body, complete the body logically. Do not alter gender presentation, age or ethnicity.
  If @Image 1 or @Image 2 is a reference sheet with several views, combine all views into ONE consistent character; never reproduce the sheet layout, the grey studio background or multiple copies in the video.
  ARMOR RULE: if a character in its photo already wears knight armor, keep that exact armor, cape and sword. If the photo shows them without armor, dress them in the armor described in CHARACTERS below; their everyday clothes from the photo are not worn.
  @Image 3 = the location. @Image 4 = the zombies.
  @Image 1 and @Image 2 never mix: no feature of one appears on the other.

  LOCATION: the misty meadow from @Image 3: long wet dewy grass, thick low fog drifting across the field, dark trees fading into the mist, an overcast sky with a faint pale glow near the horizon.

  [0s-2s] MACRO GROUND SHOT, 100mm macro lens at grass level: a single dew drop trembles on a blade of grass, pin sharp. The focus slowly racks past it to the armored back and cream cape of the animal knight from @Image 1, standing in the grass. Far behind it, the blurred dark shapes of the zombies from @Image 4 sway in the fog.
  [2s-4s] OVER-THE-SHOULDER, 35mm lens, camera at the animal's eye level just behind its shoulder, slow dolly push-in: the zombies come into focus across the meadow, about twenty metres away, swaying, heads tilted. The animal's cape lifts in the cold breeze, its sword held low and pointing down.
  [4s-6.5s] SLOW ARC, Steadicam: one smooth half-circle around the animal's left side, from its back to its profile to a tight front three-quarter close-up of its face: worried eyes, ears pulled slightly back, a nervous twitch of its nose or whiskers, a small nervous swallow, mist drifting behind it. The sword stays pointing down.
  [6.5s-8s] LONG LENS, 200mm telephoto, compressed perspective: the zombies emerge out of layer after layer of fog, flattened together into a dense wall. The closest one drags its foot through the wet grass and slowly lifts its head toward the camera with a low groan.
  [8s-10s] CRANE DOWN: the camera starts high above and slowly descends, revealing the human knight from @Image 2 lying on their back in the wet grass right beside the animal, unconscious: their face from @Image 2 with a few light scratches and a faint bruise on the cheekbone, hair spread across the grass, scuffed silver armor, the torn red cape fanned out around them. Their sword lies in the grass beside their open hand.
  [10s-11.5s] GROUND-LEVEL CLOSE-UP, 50mm lens, the camera lying in the grass: the knight's face fills one side of the frame in profile, cheek against the wet grass, a strand of hair across it if their hair allows. In the soft background the animal leans in, lets out a small worried call in its own natural voice, and nudges the knight's cheek with its paw or nose.
  [11.5s-13s] EXTREME CLOSE-UP, 100mm macro: the knight's eye snaps open, the pupil tightening as it focuses.
  --- Нейросетка |Промты | Обновления Chat
  Quick cut to their gauntleted hand closing around the hilt of the sword in the grass, dew shaking off the blade.
  [13s-14.5s] LOW ANGLE FROM THE GRASS, 24mm lens: the knight pushes themself up and rises into frame, breathing hard, their silhouette against the pale overcast sky, the red cape falling around them, sword in hand, head bare. The animal stands beside their boots.
  [14.5s-16.5s] WORM'S-EYE HERO SHOT, 24mm lens, the camera low in front of them with a slow push-in: the animal raises its sword high and lets out a loud, fierce call in its own natural voice, mouth wide open, eyes narrowed and brave. Beside it, the knight raises their sword with both hands, jaw set, determined. Behind them the zombies are a soft, blurred wall in the fog.
  [16.5s-18.5s] HANDHELD TRACKING SHOT at grass level, running fast alongside and slightly behind them: the knight and the animal charge forward together through the wet grass, water spraying from every step, both capes flying, armor clinking, fog tearing apart around them. Natural camera shake.
  [18.5s-20s] TOP-DOWN DRONE, rising slowly straight up: from directly above, the knight and the animal run across the meadow toward the zombies, who close in from the fog in a wide half-circle. The mist drifts across the frame. Hold on this frame to the end.

  CHARACTERS
  The animal is exactly the animal from @Image 1 in every shot — same species, breed, size, fur or feathers, colors, markings, eyes, face and accessories. Its armor (from @Image 1 if shown there, otherwise this): custom-fitted miniature knight armor shaped to its body — polished silver plate on the chest, shoulders and legs with fine engraved edges, a short chainmail skirt, brown leather belts with small buckles, a worn cream hooded cape, and a small silver sword with a gold crossguard. Its head is completely uncovered: no helmet, ears, eyes and face fully visible.
  How the animal holds the sword: in its front paw or paws if its anatomy allows; otherwise gripped by the handle in its mouth, or in its beak for a bird. It never drops the sword.
  The human knight is exactly the person from @Image 2 in every shot — same face, facial features, skin tone, hairstyle, hair length and color. Their armor (from @Image 2 if shown there, otherwise this): scuffed silver plate armor with gold-trimmed engraved edges, lion-head shoulder plates, a red shield-shaped crest with a gold lion on the breastplate, chainmail at the arms and hips, a brown leather belt, a red tabard with a gold lion hanging at the front, armored gauntlets and leg plates, brown leather boots, a long torn and frayed dark-red cape, and a silver longsword. The head is completely bare: no helmet, no coif, no visor; the face and hair are fully visible in every shot.
  No changes to either character.

  ZOMBIES: exactly the zombies from @Image 4: realistic film-makeup zombies with grey cracked skin and filthy, torn everyday clothes, each one different. They walk with heavy, dragging, limping steps, each with its own slow rhythm, heads lowered and lolling, arms hanging loosely; their movement is stiff and real, never robotic or in sync. No gore, no blood.

  PERFORMANCE: natural, believable expressions, as if directed by a professional. The animal moves and reacts like a real animal of its species: small head tilts, flicking ears, twitching nose or whiskers, real weight on its paws or feet. The knight's waking, coughing, pain and determination are subtle and real, never exaggerated.

  REALISM: real physics and weight in every movement, real fur or feathers, hair and cloth moving in the wind, wet grass bending and springing back, water droplets flying, real metal reflections of the grey sky, breath visible in the cold air, natural lens flares and slight lens breathing on focus pulls, fine film grain. Nothing is ever static: mist, grass, capes and hair always move.

  SOUND: cold wind over the grass, distant crows, low zombie groans growing louder as they approach, the animal's small worried call in its own natural voice at 10.
