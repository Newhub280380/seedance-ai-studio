prompts_verbatim:
- "\uFEFF1 СПОСОБ (сториборд на Lavanda ai) \n\n\n- ТАБЛИЦА ПЕРСОНАЖЕЙ (их лица с разных сторон, файл в комментах в телеграм, его прикрепляете и пишите промт):\n\nПроанализируй файл который я тебе скинул\
  \ и видео.\nИспользуй этот файл и опиши каждого героя который появится в мультике. Выдай мне промты для создания генерации персонажа и листа персонажа.\nГероев, локацию, обстановку и всё вообще бери из\
  \ ролика который я тебе скинул.\n\n\n2 СПОСОБ (Seedance 2.5) \n\n- ТАБЛИЦА ПЕРСОНАЖЕЙ (Если есть видео конкурента, то используйте этот промт, получите - лица с разных сторон, файл в комментах в телеграм,\
  \ его прикрепляете и пишите промт):\n\nПроанализируй файл который я тебе скинул и видео.\nИспользуй этот файл и опиши каждого героя который появится в мультике. Выдай мне промты для создания генерации\
  \ персонажа и листа персонажа.\nГероев, локацию, обстановку и всё вообще бери из ролика который я тебе скинул.\n\n\n– ИДЕЯ ДЛЯ ВИДЕО (если нету идеи, прикрепляете скрин стиля из пинтерест, файл, меняете\
  \ длительность под себя и пишите промт): \n\nПроанализируй файл и изображение которое я тебе скинул и предложи идеи для создания ии мультика на 30 секунд \n\n\n– ПРОМТ ДЛЯ SEEDANCE 2.5 (прикрепляете свои\
  \ фотки и т.д. и пишите промт):\n\n\nТеперь мне нужно всё заполнить, чтобы получился готовый промт для seedance 2.5, помоги мне с заполнением, и дай мне готовые промты на русском и английском языке, спрашивай\
  \ меня о возможных решениях и том как бы я хотел видеть этот минутный ролик\n[REFERENCES]\n@[name]\n@[location]\n@[voice]\n[VOICES PROMPT]\n@[name]: \"A [age]-year-old [nationality] [man/woman/boy/girl].\
  \ [Timbre and register]; [pace and delivery]\n[GOAL]\n[A brief description of what happens in this shot]\n[CONTINUITY]\nSubjects: [who appears where, and who never appears in the same shot as whom].\n\
  Scene: [locations, time of day, light direction].\nProps: [what each character carries or wears].\n[SHOTS]\nShot 1 1-2s: [Shot size and angle]. [What happens in frame]. [Dialogue]\nShot 2 2-5s: [Shot\
  \ size and angle]. [What happens in frame]. [Dialogue]\nShot 3 5-8s:...\n[VISUAL STYLE] feature-quality 3D animated film\n[CAMERA AND PERFORMANCE]\nReal-time motion, no slow motion. Rule of thirds.\n\
  @[name] [what they want, from whom]\n[AUDIO]\n([music, or \"no music anywhere in this segment\"]) [specific ambience] or [sound effects]\n[EXCLUSIONS] [negative prompts]\n[MAINTAIN CONSISTENCY] [Rules\
  \ to maintain consistency]"
- "\uFEFFПРОМТ ДЛЯ ГЕНЕРАЦИИ ПРОМТА ДЛЯ seedance 2.5\n\nМОЯ ИДЕЯ:\n[ЗДЕСЬ ОПИШИ, ЧТО ТЫ ХОЧЕШЬ ПОЛУЧИТЬ В ВИДЕО]\nИспользуй прикреплённый файл с инструкцией по Seedance 2.5 как основной framework для создания\
  \ финального промта.\nТакже внимательно проанализируй все прикреплённые мной видео и изображения перед написанием промта.\nЕсли я прикрепил видео, обрати особое внимание на:\n- реальные движения человека\
  \ или объектов;\n- направление взгляда;\n- выражения и реакции;\n- движение и положение камеры;\n- композицию;\n- ключевые события и их тайминг.\nЕсли видео является Blender / graybox / blockout-анимацией,\
  \ используй из него только то, что действительно нужно как reference: движение, blocking, timing и camera motion. Не переноси в результат внешний вид манекена, серые материалы, исходное освещение или\
  \ окружение.\nНе копируй исходную анимацию механически. Если это улучшает реализм, самостоятельно добавляй естественные микродвижения: моргание, дыхание, небольшие движения глаз, головы и плеч, инерцию\
  \ тела, движение волос и одежды, естественные паузы и вторичную анимацию.\nЕсли персонаж реагирует на событие, сделай реакцию логичной:\nсобытие → взгляд → движение глаз и головы → мимика → реакция тела.\n\
  При необходимости слегка корректируй направление взгляда и головы относительно исходника, чтобы персонаж действительно смотрел на объект или событие, на которое реагирует.\nЕсли сцена предполагает handheld-съёмку,\
  \ камера должна физически ощущаться как камера в руках человека: небольшие смещения позиции, наклоны, drift, parallax, инерция и естественные коррекции. Не используй простой digital shake.\nСледи за пространственной\
  \ логикой, физикой, освещением и взаимодействием объектов. Свет от VFX или других источников должен естественно попадать на персонажа, одежду и окружение.\nГлавный приоритет:\nфотореализм, естественные\
  \ человеческие движения, правдоподобная физика, красивый свет и ощущение настоящей съёмки, а не AI-анимации.\nЕсли моей идеи и прикреплённых материалов достаточно — сразу создай финальный промт по правилам\
  \ прикреплённого файла.\nЕсли без уточнения действительно невозможно выбрать между принципиально разными результатами — задай только один короткий вопрос.\n\n\n\n\nПромт для генерации таблицы референсов\
  \ (изображения с разных сторон) \n\n\nвот мой персонаж. можешь сделать мне промпт для character sheet. Мне нужны 4 крупные планы и 4 отдаленных плана где видны мои ноги. ВСё на одной доске"
