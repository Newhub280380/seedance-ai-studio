  A modern glass residential tower with a grid of floor-to-ceiling windows. One window on a high floor: a tall panoramic window into a modern apartment room with light warm-grey walls, a dark floor, the edge of a bed with white linen on one side. A tall full-length mirror in a thin black frame stands against the back wall directly opposite the window.
