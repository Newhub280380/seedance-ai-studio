  A light cream curtain hangs gathered at the left edge of the window.

  LIGHT
  Golden hour: a low, warm evening sun hits the glass facade. The sun glints off the glass, warm reflections slide across the windows. Long slanting stripes of warm sunlight fall into the room across the floor and the back wall. The person is lit by the warm low sun.

  CAMERA
  An ordinary person on a phone, hiding in the building across the street at the same height. Handheld: visible hand shake, imperfect framing, slight digital-zoom softness and noise, autofocus hunting at the start. No stabilizer, no tripod, no smooth cinematic moves.

  TIMELINE
  0.0–3.5s — ZOOM IN
  Start wide on the glass tower in warm evening sun, a bright sun glint on the glass. The camera clumsily zooms in toward one window on a high floor, the framing wandering and jerking before it settles, the autofocus hunting. Inside the window the small figure of the @image1 person becomes visible.

  3.5–8.0s — FOOLING AROUND AT THE MIRROR
  The zoom stops: the window fills the frame, only a small hand shake. The person stands facing the mirror on the back wall, with their back to the window and to the camera; their face is seen in the mirror. They fool around carefree as if alone: a loose playful dance, swaying and rolling the hips to music, adjusting their hair with both hands, turning to profile and back, checking themselves out. At 5.0–6.0s they let out a short, light chuckle at themselves, shoulders shaking slightly, then carry on. Relaxed, playful, at-home movements.

  8.0–9.5s — NOTICING THE CAMERA
  They suddenly stop, glance over their shoulder toward the window, freeze, realizing they are being watched. A slow sly smile spreads across their face. They turn around to face the window, looking straight into the camera.

  9.5–11.2s — THE CURTAIN
  Still holding eye contact with the camera and smiling, they walk up to the window, grab the cream curtain at the left edge and pull it across the whole window in one quick movement.

  11.2–12.0s — FINAL
  The closed curtain fills the window, still swaying slightly, warm sunlight glowing through the fabric and leaking around its edges. The camera stays on it, shaking slightly. End.

  AUDIO
  Ambient city sound recorded by the phone: distant traffic, wind; faint muffled music coming from the room; at 5.0–6.0s a short, light chuckle; at 9.5–11.2s the rustle of fabric and the curtain rings sliding along the rod. No speech, no voiceover.

