prompts_verbatim:
- |-
  If one face keeps going wrong in your AI story clips, you don't need to regenerate the whole clip every single time bro

  Small stuff like the hair changing color between scenes? Nobody cares, your viewer is there for the story.

  But a face going wrong MID-CLIP is a broken shot.

  So you go to fix it, and that's where the time goes.

  The old workflow: generate a 6 second clip. The face goes wrong in the second half. Regenerate the entire clip. Wait. Now the lighting shifted. Regenerate again.

  Three tries per clip and your whole afternoon is gone. Then you post the least broken version anyway 💀

  The new workflow: region level editing in Seedance 2.5. You select the face, fix only the face, and the rest of the frame stays exactly how it came out.

  But you need something to fix the face back to. Build that FIRST. Most of you skip it.

  Here's how:

  Step 1: the character sheet.

  One picture of your character that every other image copies from. Make it before you generate a single scene.

  My script template is a JSON file. It lists every character's looks (the character registry), so Claude doesn't forget who's who by chapter 5. This prompt pulls straight from it:

  "Using the character registry from my script JSON, generate a character reference sheet for [NAME] with Nano Banana Pro: front facing, neutral expression, full body, consistent lighting, plain background. Include every physical detail from the registry. This image becomes the reference for every subsequent generation of this character."

  No template? Paste your character's description where the prompt says registry.

  Step 2: every scene prompt with your character in it uses that sheet as its reference.

  Step 3: when a face still drifts, fix just the face back to the sheet.

  The tools, 1 tool = 1 job:

  Nano Banana Pro for the character sheet and every frame your main character is in
  Flux for scenes, places and atmosphere
  Seedance 2.5 for the animated intro clips and the face fixes

  And the intro clips are non-negotiable. Your viewer decides in the first 5 seconds if this video is worth 40 minutes of her evening. If something moves, it looks like a real produced video. If it's just still images, it looks like a slideshow and she clicks off.

  Lock the face once, and put the hours you save into your storytelling.

  The full visual workflow and prompts are inside Elevate at elevate(.uno).

  Or DM me "STACK" if your characters keep drifting mid-video.
