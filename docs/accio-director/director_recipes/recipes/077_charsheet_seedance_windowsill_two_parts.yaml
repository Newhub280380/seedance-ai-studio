  \ and accessories identical to the reference unless otherwise specified.\nNeutral standing pose with relaxed arms. Consistent lighting across every view. Plain light gray studio background. Clean character\
  \ turnaround layout similar to a professional game or animation model sheet.\nUltra-sharp, highly detailed, photorealistic, perfect facial consistency across every panel. No face drift, no identity changes,\
