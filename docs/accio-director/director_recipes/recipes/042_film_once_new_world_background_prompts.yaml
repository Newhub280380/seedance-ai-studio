steps:
- n: 1
  action: '@ledger599 (пост целиком):

    [PROMPT]'
  tool: unknown
  mode: unknown
  prompt:
  - |-
    Here's exactly how to film yourself in a field and end up on a private beach.

    step 1. shoot one clean video of yourself. a simple location is best, an empty field, a parking lot, a blank wall. good daylight, steady camera, your full body in frame. walk, talk, gesture naturally. this is your motion reference, so the movement matters more than the background.

    step 2. go to an AI video tool that supports video-to-video with a reference (OpenArt, Runway, Kling, Higgsfield all do this). upload your clip.

    step 3. tell it to keep your motion but rebuild the world. the prompt is the whole trick: "keep the exact body motion, timing and gestures from the reference video. replace the entire environment with a luxury tropical beach, white sand, turquoise water, a white modern villa and a yacht in the background, bright sunny daylight, cinematic." your movement stays, the field disappears.

    step 4. match the lighting or it looks fake. if you filmed in flat daylight, ask for "bright midday sun" so the shadows on you line up with the new scene. mismatched light is the number one thing that gives it away.

    step 5. generate, then fix. first result is usually 80 percent there. push back: "more realistic sand texture," "keep my face consistent," "remove the warping on my hands." 2 to 3 passes and it's clean.

    step 6. export, cut to 15 seconds, post. the swap between your real field and the fake beach IS the hook, so show both.

    the whole thing is one principle: film the performance once, generate the world as many times as you want. one take, infinite locations.
