- n: 2
  action: 'Seedance 2.5 (у автора — бот Cyber AI → видео → Seedance 2.5): загрузить фото с разметкой, формат под пропорции исходника, вставить промпт, заполнить поля [DURATION], [MEDIUM AND ERA], [SOUND];
    блок OPTIONAL — по желанию или удалить.'
  tool:
  - Seedance
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: unknown
  duration: unknown
