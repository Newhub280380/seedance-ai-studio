prompts_verbatim:
- |-
  FIRST FRAME: exactly the reference image, full composition, untouched -but WITHOUT any drawn line, arrow, dot or marking. The coloured path drawn on the image is a DIRECTOR'S ANNOTATION, not part of the scene. It is never rendered, never visible, never treated as an object, never lit and never reflected. Remove it completely from every single frame. READ THE DRAWN PATH AS THE CAMERA MOVE. The solid dot marks where the camera starts. The arrowheads mark the direction of travel. The line marks the exact trajectory the camera flies through the scene, in three dimensions -where the line passes in front of an object the camera is near, where it passes behind an object the camera is far, where it rises in frame the camera gains height, where it drops in frame the camera descends. The camera is already easing into motion from the very first frame. It never holds and never hovers. THE REFERENCE IMAGE IS A REAL 3D SPACE, not a flat picture. Read the depth: what is foreground, what is midground, what is background, what is behind what. Reconstruct the parts of the space the frame doesn't show - the sides and backs of subjects, the ground beneath them, the environment continuing past the edges of frame - inferring them from the light, perspective, materials and style already present. Everything invented must match the original exactly in lighting direction, colour palette, texture, medium and era. PRESERVE EVERYTHING IN THE IMAGE EXACTLY: every subject, face, body, pose, expression, garment, prop, surface, structure and background element, in the same position, at the same scale, in the same layout, with the same proportions. Same light direction, same colour grade, same texture, same medium, same grain. Faces never change. Nothing is added, removed, restyled or replaced. Every figure keeps exactly the pose, clothing and coverage shown in the reference. CAMERA, one unbroken [DURATION] second move, no cuts, following the drawn path from frame one to final frame: The camera traces the entire drawn line at an even, unhurried pace, spending the full duration on the path and arriving at the end of the line exactly as the shot ends. It keeps the main subject anchored in frame throughout, reframing naturally as the geometry changes. It moves through real space with real parallax - near objects sweeping past the lens fast, far objects drifting slowly. Depth layers separate visibly and continuously. IF THE DRAWN PATH RETURNS TO ITS STARTING DOT: the move closes the loop and the final frame matches the first frame exactly - same angle, same height, same distance, same layout still drifting gently as it settles rather than snapping into place. IF THE DRAWN PATH ENDS SOMEWHERE ELSE: the camera settles into a deliberate, composed final framing at the end of the line and the move decays into a slow drift. The shot ends still breathing, not frozen. CAMERA FEEL: real drone or crane operated by a human, not a CG rail. Subtle handheld float, low-amplitude gimbal drift, tiny lateral corrections, slow roll into every bank, uneven velocity with the middle of the move faster than the beginning and the end. Organic and breathing. Not robotic, not perfectly linear, not glassy. The move is one smooth continuous arc - it never reverses direction, never pauses and never crosses back over itself. MOTION IN THE SCENE - read the image and animate ONLY what would truly be moving, at the intensity the image implies: - Anything painted, drawn or photographed mid-action continues that action subtly and in place - a raised arm holds with faint tremor, taut rope or fabric carries strain, a mid-stride figure holds the stride. - Anything at rest stays at rest. Nobody walks, turns, gestures or changes expression unless the image clearly shows them doing it. - Environmental motion runs continuously and softly: drifting cloud, haze, smoke, dust in light, rippling water, swaying foliage, flickering flame, falling snow or rain, fabric and hair stirring, birds far off. - Light behaves live: slow shifts across surfaces, gentle flicker on flame-lit areas, atmosphere thickening and thinning with depth. - Micro-parallax between every depth layer at all times. - No new characters, objects, vehicles, animals or light sources ever appear. No morphing, warping, stretching or reshaping of faces, hands or bodies. [OPTIONAL -ADDED ELEMENT: describe here anything you want revealed during the move that isn't in the opening frame. State that it EXISTS IN THE SCENE FROM FRAME ONE and is simply outside the opening framing, so the camera discovers it rather than spawning it. Describe it in the same style, palette and light as the rest of the image. Delete this whole block if you don't want one.] STYLE: [MEDIUM AND ERA - e.g. Renaissance oil painting / 35mm film photograph / anime cel / 3D render / documentary footage], fully preserved. Cinematic, 24fps, shallow depth of field with focus riding the nearest subject, filmic grade true to the original palette, fine grain, no colour shift, no stylistic drift. NEGATIVE: no drawn line, no arrow, no dot, no coloured marking, no path overlay, no UI, no text, captions, watermarks, logos or on-screen writing. No cuts, no jump, no teleport, no camera reversal, no flicker, no morphing faces, no extra limbs or fingers, no duplicated subjects, no style change. AUDIO: no music, foley only - [SOUND, e.g. faint room tone, wind, distant murmur, brush on canvas].
