prompts_verbatim:
- "\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\n\nИнструкция:\n1. Делаем фото вашего помещения, куда вы хотите вставить потом ИИ персонажа\n\
  2. Переходим в VeoSeeBot \n3. Nano banana Pro\n4. Вставляете фото помещения, фото персонажа и пишите похожий промпт (попросите chat gpt подстроить под ваш запрос):\nОставить исходное фото полностью без\
  \ изменений: тот же интерьер, освещение, ракурс, композиция, дверь без ручки, тени и фон. В сцену аккуратно добавить антропоморфную панду (как на втором изображении — крупная, добродушная, с черно-белой\
  \ шерстью). Панда открывает дверь и заходит в комнату: одна рука держит дверь, другая свободна, она делает шаг внутрь. Панда расположена в дверном проёме, частично внутри комнаты. Важно: реалистично вписать\
  \ персонажа в сцену — правильный масштаб относительно двери без ручки, корректные тени на полу и стенах, мягкое тёплое освещение как в оригинале, свет от лампы падает на панду. Сохранить глубину резкости,\
  \ цветокоррекцию и атмосферу исходного снимка. Стиль — фотореализм с элементами качественной 3D-анимации, без изменения фона и композиции, только добавление персонажа\n\n5. Kling 3.0\nВставляете получившееся\
  \ фото, можно два как в моем случае. Первый кадр — фото с дверью, второй кадр — панда открывает дверь. Если у вас одно действие, то используйте одно фото. Пишите простой промпт:\nПанда открывает дверь\
  \ и заходит в комнату\n\nТак делаете со всеми ракурсами, потом соединяете все части в капкате и получается полноценное видео\n\nСтавьте «\U0001F525», если было полезно"
