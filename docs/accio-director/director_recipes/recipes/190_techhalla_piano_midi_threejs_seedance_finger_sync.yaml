prompts_verbatim:
- |-
  Perfect finger sync 👌
  · Suno for the music
  · Three.js in a single HTML file to turn MIDI into 3D
  · One for the images
  · Seedance 2.5 for the video conversion
- |-
  If you make music with Suno, you can export the MIDI and generate the 3D video just like I did using the HTML I shared.
  Then, we extract the first frame and transform it with Magnific One! It's my go-to model for pretty much everything right now.
  Prompts in the space.
- |-
  Now we just give Seedance 2.5 both references (the video and the first frame) and ask it to use the 3D animation as a reference for the notes our main character is playing.
  Add extra details like moving waves... whatever you can think of! Once again, the prompt is in the Space.
