- |-
  Фотореалистичная кинематографичная видеозаставка 21:9, 15 секунд, без звука. Один непрерывный план, неподвижная камера 28 мм за спиной мужчины, чуть выше плеч и немного справа. Мужчина около 35 лет, короткие тёмно-каштановые волосы, чёрное худи, сидит за деревянным столом и спокойно работает. Видны только спина и затылок, голову не поворачивает. Ноутбук сдвинут вправо, экран и часть клавиатуры видны справа от плеча. На столе маленькая тёплая лампа. Человек и стол занимают четверть ширины кадра, важные детали в центральной горизонтальной полосе. За столом на протяжении всего ролика находится одна огромная изогнутая арка. Её контур, положение и две опоры остаются узнаваемыми во всех мирах. Это один объект, непрерывно перестраивающийся вместе с ландшафтом, а не шесть разных изображений. Шесть миров по 2,5 секунды: 1,5 секунды любуемся миром, следующую секунду наблюдаем его физическое превращение. 0–1,5: белая соляная равнина, персиковый рассвет, арка из полированного серебристого металла. 1,5–2,5: металлическая поверхность вспучивается и разделяется на толстые переплетающиеся корни; соляная корка растрескивается и поднимается скальными уступами, из трещин быстро разворачиваются листья. 2,5–4: тропические скалы с водопадами, гигантская арка из живых корней. 4–5: корни размягчаются, вытягиваются в плотные потоки воды; скалы оседают, вода заполняет углубления и затопляет долину. 5–6,5: зеркальный океан, арка стала огромным завитком волны с густой белой пеной. 6,5–7,5: по волне снизу вверх растут ледяные кристаллы, гребень застывает, поверхность океана покрывается матовым льдом. 7,5–9: полярный мир, монументальная ледяная арка. 9–10: лёд уплотняется, становится зернистым и терракотовым; снежные гряды осыпаются песком, складываясь в барханы. 10–11,5: красная пустыня с аркой из слоистого песчаника. 11,5–12,5: песчаник растрескивается и светлеет, барханы проседают в кратеры, небо постепенно темнеет. 12,5–14: лунная равнина и белая каменная арка под звёздами. 14–15: кратеры выравниваются в соляную равнину, арка разглаживается до серебристого металла, возвращается рассвет первого кадра. Каждое превращение показывать через деформацию существующей геометрии, рост и движение материала. Без crossfade, dissolve, прозрачных призраков, двойной экспозиции, наложения кадров, монтажных склеек и вспышек. Человек, стол, стул, ноутбук и лампа не трансформируются. Реальные контактные тени и отражения, без текста и логотипов.
