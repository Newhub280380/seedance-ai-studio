  action: 'Бот VeoSeeBot → «Открыть NEUROPLACE или VeoSeeBot» → раздел «Nano Banana pro». Модель NanoBanana Pro; изображения: своё фото + фото образа; запрос — промпт карточки (ниже, в комментариях); соотношение
    16:9; качество 4K → Сгенерировать.'
