  \ здания, второе фото со зданием и вставляем этот промпт:\n\nUltra-realistic cinematic timelapse, daylight progression from sunrise to sunset, adaptive static camera, natural lighting and shadows, realistic\
  \ construction machinery and human motion. \n\n[00:00–00:01] Wide static shot of an empty construction site at dawn. The camera is positioned slightly elevated, showing the entire area where the future\
  \ building will rise. Workers and vehicles arrive, fencing and markings appear. Excavators begin digging the pit. Ambient: light wind, distant city hum, engine start sounds. \n\n[00:01–00:03] Excavation\
