  \ sound of tools and wind. \n\n[00:07–00:08] The finished building stands complete. The lighting transitions gently to dusk. Cars move on nearby roads — a subtle hint of life. The windows light up briefly.\
  \ Camera remains stable to the very end. SFX: soft evening ambience, subtle orchestral swell. Camera behavior: Adaptive static timelapse camera — remains nearly fixed but gently adjusts framing and focal\
