title: Замена героя и всей массовки в чужом видео (главный — @image1, толпа — клоны @image2) — Seedance 2.5 Omni Reference 30 с
intent_tags:
- client_in_clip
- meme
- animal
- dance
use_when: Берётся вирусное видео с толпой (у автора — собаки танцуют у входа в школу). Первого идущего героя меняют на ваш реф, всех остальных — на клонов второго рефа; хореография, камера и окружение сохраняются.
inputs:
- видео-референс (движение/клип)
steps:
- n: 1
  action: Seedance 2.5, режим Omni Reference, 16:9, 30 с, разрешение любое.
  tool:
  - Seedance
  mode: Omni
  prompt: unknown
  input_source: user_input
  duration: 30 с
  aspect: '16:9'
- n: 2
  action: Загрузить @video1 (исходник), @image1 (главный герой), @image2 (персонаж для массовки).
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: unknown
  duration: unknown
  aspect: unknown
- n: 3
  action: 'Вставить промпт; по словам автора, адаптируется: главный один персонаж, массовка — другой.'
  tool: unknown
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: unknown
  duration: unknown
