prompts_verbatim:
- |-
  Edit this image to create the same property before the house was built. Remove only the entire modern house structure, including its white walls, roof forms, windows, balconies and attached architectural elements. Keep the swimming pool, pool water, tiled edge, paving, garden, trees, sky, lighting, colors, camera position, framing and perspective unchanged. Naturally reconstruct the background in the area previously occupied by the house, continuing the existing sky, distant trees and garden. The result should look like the same photograph taken from the same camera position before construction, with the pool and surroundings intact. Photorealistic. Do not add another building, construction machinery, people, text, logos or watermark.
- |-
  Create a 15-second photorealistic architectural construction sequence in one continuous FPV shot.

  IMAGE ROLES:
  Image 1 is the empty property with the swimming pool. Use it as the starting scene reference.
  Image 2 is the finished house. Use it as the exact final building reference and end image.

  BUILDING:
  Recreate the exact modern house shown in Image 2: a sculptural multi-storey luxury home with bold white curved concrete forms, projecting upper volumes, large dark-framed floor-to-ceiling windows, open balconies, dark horizontal slatted details, and warm interior lighting. Preserve its recognizable silhouette, proportions, placement, materials and architectural details. Do not invent a different house.

  ENVIRONMENT:
  Keep the swimming pool, pool edge, water, paving, garden, trees, sky, lighting and composition consistent with Image 1. The house assembles on the land behind the pool. The pool and garden are fixed background elements and must remain unchanged. Do not make construction materials rise from the water or damage the pool.

  00:00–00:03 — The camera glides low above the pool edge toward the empty building site. Dust and small fragments begin to lift from the ground behind the pool. The pool and garden remain still.

  00:03–00:06 — Gravity reverses. Structural columns, concrete slabs and large white architectural sections shoot upward from the site. They rotate into position and lock together, forming the distinctive frame and curved volumes of the house.

  00:06–00:10 — The camera makes a fast, controlled orbit around the rising structure. White facade sections, balconies, dark window frames and slatted details fly upward and attach to the building in clearly visible stages. Keep the pool in the foreground as a stable visual anchor.

  00:10–00:13 — Large glass panels and remaining facade pieces rise into place. Warm interior lights switch on as the house nears completion. Preserve the exact architecture shown in Image 2.

  00:13–00:15 — The final roof and facade elements snap into place with one strong impact. The camera pulls back slightly into a dramatic low-angle hero view that matches the finished-house reference.

  One continuous shot, no cuts. Make the upward direction of gravity clearly visible. Use realistic material weight, strong but readable motion, cinematic dust, motion blur, wind and structural impacts. Keep the house consistent throughout the sequence.

  No morphing, no duplicated floors, no changing architecture, no extra buildings, no floating pool, no materials emerging from the water, no text, captions, logos or watermark.

  Audio: no music and no voiceover; only cinematic construction sounds, rising debris, rushing wind, concrete impacts, glass and facade elements locking into place, and a final low impact.
