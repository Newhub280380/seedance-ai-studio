  \U0001F525\n#тренд #видео #промт #trend #video #promt #ai #alenasedykh #storisgid\n\n--COMMENTS--\n### comments storisgid/17919\n--- \U0001D412\U0001D413\U0001D40E\U0001D411\U0001D408\U0001D412\U0001D406\
  \U0001D408\U0001D403 | \U0001D402\U0001D407\U0001D400\U0001D413 \U0001F4AC\n⤷ ПРОМПТ ДЛЯ ВИДЕО:\nСоздайте фотореалистичное видео с днем рождения в кинематографическом стиле. \n\nОРИЕНТИРЫ: @image1 = точное\
  \ изображение женщины.  Сохраните ее лицо, пропорции. Безупречный макияж: кошачьи стрелки черные, натуральные ресницы хорошо прокрашены тушью верхние и нижние, идеальный загорелый тон кожи, губы очерчены\
  \ карандашом темно-коричневый и сверху прокрашены блеском коричневым. Длинные волосы голивудские локоны очень объемные у корней.  На ней белое кружевное платье с белыми среднего размера цветочками по\
  \ всему платью, длинные шифоновые рукава украшенные такими же цветами: присборенный воротник с рюшами, структурированный корсетный лиф, литое платье, приталенный силуэт, разрез спереди и струящаяся юбка.\
  \ Маникюр молочный миндаль, ровный, аккуратный. Без фаты и дополнительных аксессуаров.  @image2 = точное изображение мужчины-водителя и его наряд.  Сохраните его лицо, темные волосы, аккуратную бороду.\
  \  Не смешивайте и не меняйте местами изображения.  Дополнительные ориентиры, если таковые имеются, определяют ТОЛЬКО сцену и действия.  Не обращайте внимания на интерфейсы со скриншотами. \n\nСЦЕНА:\
  \ ночное шоссе, мокрый асфальт, в котором отражаются уличные фонари.  Роскошный, черный Rolls-Royce\nCullinan с русскими номерами: Л999АВ 99\nВесь кузов блестит и переливается в свете уличных фонарей,\
  \ создавая эффектные блики на капоте, дверях, крыльях и задних панелях. Черная краска должна выглядеть превосходно. На протяжении всего видео автомобиль должен оставаться ЧЕРНЫМ.\n\nЖенщина стоит по пояс\
  \ в открытом люке машины, ее юбка остается внутри салона. Мужчина по-прежнему сидит за рулем, и его можно узнать через боковое стекло, мягко подсвеченное лампочкой на приборной панели. К задней крыше\
  \ надежно привязаны красные металлические воздушные шарики в виде сердечек, развевающиеся ленточки.\n\n0-4 секунды: Видео снято из другого автомобиля, едущего рядом. Уличные фонари непрерывно освещают\
  \ черный корпус Rolls-Royce\nCullinan, заставляя его переливаться при движении. Она энергично встряхивает бутылку зеленого шампанского обеими руками. При встряхивании пробка выскакивает, выбрасывая мощный\
  \ фонтан шампанского и белой пены. Стеклянная бутылка остается нетронутой. Она смеётся и радостно кричит: «Ура!» Её волосы и кружевные оборки развеваются на ветру. \n\n 4–8 с.: Она подбрасывает ТУ ЖЕ\
  \ самую бутылку высоко над машиной. Бутылка описывает правдоподобную дугу, разбрызгивая капли. Камера наклоняется, чтобы бутылка оставалась в поле зрения. ОТПУСТив бутылку, она берёт пистолет, лежащий\
  \ рядом с люком на крыше, поднимает его, прицеливается в летящую бутылку и делает ОДИН выстрел. Короткая вспышка из дула и естественная отдача. Бутылка разбивается ТОЛЬКО при ударе, превращаясь в осколки\
  \ стекла и искрящийся туман из шампанского. Короткая замедленная съёмка, затем обычная скорость. Ни огненного шара, ни второй бутылки. \n\n 8–12 с.: Камера возвращается к ней. Она убирает пистолет в салон,\
  \ смотрит в камеру, улыбается и посылает ОДИН воздушный поцелуй: кончики пальцев касаются губ, затем рука вытягивается в сторону зрителя. Черный Rolls-Royce\nCullinan набирает скорость и выезжает на соседнюю\
  \ полосу, обгоняя машину, в которой ведётся съёмка. Камера естественным образом переключается с вида сбоку на вид сзади в три четверти по мере того, как машина вырывается вперёд. Глянцевый черный кузов\
  \ продолжает отражаться и сверкать в свете уличных фонарей. Машина не разворачивается и не скользит боком.\n\n12–15 с.: Девушка опускается в салон через ТОТ ЖЕ люк в крыше, ее кружевные рукава естественным\
  \ образом следуют за ней. Никакой телепортации. Вид сзади: черный Rolls-Royce\nCullinan удаляется по мокрому шоссе, его полированный кузов все еще переливается в свете фонарей, на мокром асфальте отражаются\
  \ красные задние фонари, а на крыше все еще висят воздушные шары. В верхней части кадра появляется тонкий изящный белый курсивный текст: «С Днём Рождения меня!». Сохраняйте четкость до конца.\n\nСохраняйте\
  \ одинаковые лица, наряды, кружевные детали, реалистичную анатомию, руки, гравитацию и непрерывность объектов.\n\nАвтомобиль должен оставаться тем же Rolls-Royce\n\U0001F44D1\n--- \U0001D412\U0001D413\
  \U0001D40E\U0001D411\U0001D408\U0001D412\U0001D406\U0001D408\U0001D403 | \U0001D402\U0001D407\U0001D400\U0001D413 \U0001F4AC\nCullinan с тем же черным цветом на каждом кадре. Сохраняйте одинаковые пропорции\
  \ кузова, колеса, хромированные детали и экстерьер. Черный кузов должен заметно блестеть, переливаться и отражать свет на протяжении всего видео. Никакой матовой краски. Никакой тусклой черной краски.\
  \ Никаких изменений цвета. Никаких лишних конечностей, искажений лиц, смены одежды, трансформирующегося автомобиля, смены моделей или исчезающих воздушных шаров.\n\nЗвуки: ветер, шум дороги, хлопок пробки,\
  \ брызги шампанского, радостные возгласы, один выстрел и звон бьющегося стекла. Реалистичное кинематографическое ночное освещение и едва заметное размытие в движении.\n\U0001F5251\n--- \U0001D412\U0001D413\
  \U0001D40E\U0001D411\U0001D408\U0001D412\U0001D406\U0001D408\U0001D403 | \U0001D402\U0001D407\U0001D400\U0001D413 \U0001F4AC\nПОШАГОВАЯ ИНСТРУКЦИЯ \U0001F446\n\nНа скринах показала, как создать запрос,\
