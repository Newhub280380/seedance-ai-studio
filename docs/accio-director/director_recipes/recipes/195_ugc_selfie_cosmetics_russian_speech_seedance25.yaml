title: 'UGC-ролик косметики «снято на фронталку» с русской речью: фото девушки (@Image1) + фото продукта (@Image2) → один промпт Seedance 2.5 на 15 с, 4 сцены с репликами + правила, как заставить Seedance
  говорить по-русски'
intent_tags:
- product_ad
- beauty_ad
- talking_head
use_when: 'UGC-ролик косметики «снято на фронталку» с русской речью: фото девушки (@Image1) + фото продукта (@Image2) → один промпт Seedance 2.5 на 15 с, 4 сцены с репликами + правила, как заставить Seedance
  говорить по-русски'
inputs:
- фото товара/продукта
- аудио/голос
- логотип
steps:
- n: 1
  action: '@Image1 — фото девушки (лицо — строгий референс), @Image2 — фото продукта (упаковка, логотип, надписи, текстура).'
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: user_input
  duration: unknown
  aspect: unknown
- n: 2
  action: Seedance 2.5, 9:16, 15 с; вставить промпт ниже целиком (меняются бренд MIXIT, описание девушки, реплики).
  tool:
  - Seedance
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: unknown
  duration: 15 с
  aspect: '9:16'
- n: 3
  action: 'Русская речь — по 10 правилам поста 1114: всё описание сцены на английском, реплики на русском; одна реплика — одна строка; короткие фразы; между репликами — действие; блок липсинка. (В самом
    UGC-доке описание на русском — автор этого правила не соблюдал; ответ автора на жалобу на искажения: «фразы должны быть краткие… чёткая разбивка по таймингу и персонажам».)'
  tool: unknown
  mode: липсинк
  prompt: unknown
  input_source: unknown
  duration: unknown
  aspect: unknown
prompts_verbatim:
- "\uFEFF15-секундное вертикальное видео 9:16, ультрареалистичный close-up UGC-влог, снятый девушкой самой на смартфон с вытянутой руки. Это НЕ реклама и НЕ постановочная beauty-съёмка. Видео должно выглядеть\
  \ как обычный личный ролик в конце дня: девушка наносит средство MIXIT перед сном и параллельно говорит в свою камеру.\n\n\nREFERENCE LOCKS\n\n\n@Image1 = строгий референс внешности девушки.\nИспользуй\
  \ @Image1 только для сохранения её идентичности: лицо, форма лица, глаза, цвет глаз, кожа, веснушки, брови, нос, губы, волосы, цвет волос, длина, причёска, пропорции лица.\n\n\nЛицо девушки должно оставаться\
  \ 100% узнаваемым и одинаковым во всех кадрах. Не улучшать, не менять черты, не делать более модельной внешность, не менять возраст.\n\n\n@Image2 = строгий PRODUCT REFERENCE средства MIXIT.\n\n\nИспользуй\
  \ @Image2 исключительно для точной идентичности продукта:\n— форма упаковки;\n— размер и пропорции;\n— материал;\n— цвет;\n— крышка;\n— логотип MIXIT;\n— название продукта;\n— все надписи;\n— расположение\
  \ текста;\n— типографика;\n— текстура и цвет самого средства.\n\n\nНе придумывай новую упаковку и не меняй дизайн. Все надписи на продукте должны совпадать с референсом и быть правильно написаны. Когда\
  \ упаковка попадает в фокус, логотип MIXIT и название продукта должны быть читаемыми.\n\n\nДЕВУШКА\n\n\nМолодая женщина 22–27 лет.\n\n\nДлинные светло-каштановые волосы с мягким карамельным балаяжем,\
  \ центральный пробор, немного небрежные естественные волны. Несколько прядей падают на лицо.\n\n\nСветлая или слегка загорелая кожа с натуральными веснушками на носу и щеках. Натуральные густые брови.\
  \ Голубо-зелёные глаза. Без заметного макияжа.\n\n\nНебольшие голубые серьги-кольца из смолы, тонкая золотая цепочка с маленькой жемчужиной.\n\n\nНа ней свободная белая льняная рубашка поверх белого трикотажного\
  \ топа. Рубашка полностью закрывает тело, ворот немного неровный, рукава закатаны.\n\n\nОБСТАНОВКА\n\n\nСпальня на вилле во время золотого часа.\n\n\nИз-за очень тесного кадрирования фон виден только\
  \ фрагментами:\n— белая штукатурка;\n— угол смятого белого постельного белья;\n— открытая дверь или большое окно;\n— за ним сильно размытые ветки оливы и бугенвиллии.\n\n\nФон всё время мягкий, естественно\
  \ размытый, без декоративной постановочности.\n\n\nСВЕТ\n\n\nОдин и тот же свет во всём ролике.\n\n\nНизкое тёплое солнце приходит слева из открытой двери. Мягкий отражённый свет от белых стен заполняет\
  \ правую сторону лица.\n\n\nНа левом краю волос, щеки и подбородка — тёплый солнечный контур.\n\n\nДопускается слегка пересвеченный участок кожи там, где солнце напрямую касается щеки.\n\n\nНикакого кольцевого\
  \ света, студийного света, beauty-lighting или рекламного блеска.\n\n\nКАМЕРА\n\n\nСовременный смартфон, фронтальная камера.\n\n\nДевушка снимает себя сама с вытянутой руки.\n\n\nКрупный план на протяжении\
  \ всего видео. Лицо занимает основную часть кадра. Кадр никогда не становится шире верхней части груди.\n\n\nНатуральная небольшая дрожь руки, микрокоррекции композиции, лёгкие скачки автофокуса между\
  \ лицом и продуктом, небольшое широкоугольное искажение фронтальной камеры, естественный motion blur, rolling shutter и слабый цифровой шум в тенях.\n\n\nКамера никогда не выглядит установленной на штатив\
  \ или управляемой оператором.\n\n\nСЦЕНА 1 — 0:00–0:04\n\n\nОчень близкий фронтальный selfie-shot, камера чуть ниже уровня глаз.\n\n\nДевушка уже находится в движении: тыльной стороной запястья убирает\
  \ волосы с лица.\n\n\nСначала коротко смотрит на своё отражение на экране чуть мимо объектива, затем возвращает взгляд ближе к камере.\n\n\nВторой рукой поднимает открытый продукт MIXIT рядом со щекой.\
  \ Не вытягивает его к объективу и не демонстрирует как рекламный продукт.\n\n\nУпаковка появляется в кадре естественно, частично.\n\n\nОна медленно выдыхает носом.\n\n\nРЕПЛИКА НА РУССКОМ:\n«Так. Последнее\
  \ — и спать.»\n\n\nРечь тихая, слегка уставшая, не актёрская.\n\n\nСЦЕНА 2 — 0:04–0:07\n\n\nОна слегка наклоняет упаковку и набирает средство двумя пальцами.\n\n\nМакро-крупный план текстуры средства\
  \ и пальцев.\n\n\nТекстура должна в точности соответствовать @Image2: плотность, цвет, прозрачность, блеск, вязкость.\n\n\nЕсли средство гелевое — оно слегка тянется между пальцем и поверхностью.\nЕсли\
  \ кремовое — натурально набирается и сохраняет реальную кремовую массу.\nЕсли референс показывает другую текстуру — повторить именно её.\n\n\nНа короткий момент камера переводит фокус с логотипа MIXIT\
  \ и названия продукта на средство на пальцах.\n\n\nЛицо остаётся частично видимым на краю кадра, вне фокуса.\n\n\nРЕПЛИКА:\n«О, оно ещё и холодненькое.»\n\n\nРеплика произносится как случайное замечание\
  \ самой себе, без акцента на продукте.\n\n\nСЦЕНА 3 — 0:07–0:11\n\n\nКамера возвращается к лицу, ещё ближе.\n\n\nОна наносит средство:\n— на одну щёку;\n— немного на лоб;\n— немного на подбородок.\n\n\
  \nЗатем распределяет его ладонями или пальцами наружу по коже так, как естественно наносится продукт этого типа.\n\n\nВо время нанесения средство сначала остаётся заметным на поверхности кожи, затем постепенно\
  \ распределяется тонким естественным слоем.\n\n\nКожа НЕ становится пластиковой или идеально гладкой.\n\n\nЧерез слой остаются видны:\n— веснушки;\n— поры;\n— микрорельеф;\n— естественная краснота;\n\
  — тени под глазами;\n— маленькое несовершенство кожи около линии челюсти.\n\n\nОна слегка морщится от прохлады, естественно моргает и продолжает наносить средство.\n\n\nРЕПЛИКА:\n«Тонким слоем. И всё,\
  \ больше ничего не надо.»\n\n\nОна говорит прямо во время нанесения, не останавливая руки специально ради текста.\n\n\nСЦЕНА 4 — 0:11–0:15\n\n\nСамый близкий кадр ролика.\n\n\nОна двумя пальцами слегка\
  \ касается щеки и отрывает их, проверяя ощущения кожи.\n\n\nМедленно поворачивает голову к тёплому солнечному свету, разглядывая себя на экране телефона, а не смотря прямо в объектив.\n\n\nПо скуле виден\
  \ лёгкий натуральный влажный или ухоженный финиш, соответствующий реальному эффекту продукта.\n\n\nВ нижнем крае кадра остаётся слегка размытая упаковка MIXIT.\n\n\nОна чуть кивает сама себе. Появляется\
  \ небольшая поздняя полуулыбка.\n\n\nЗатем тянется рукой к экрану, чтобы остановить запись. В самом конце камера естественно наклоняется из-за движения руки.\n\n\nРЕПЛИКА:\n«Утром скажу себе спасибо.»\n\
  \n\nPERFORMANCE\n\n\nНастроение: конец длинного дня, низкая энергия, человек уже хочет спать.\n\n\nОна не выглядит инфлюенсером, снимающим интеграцию.\n\n\nНе говорит ярко, энергично или презентационно.\n\
  \n\nРечь немного небрежная, слова будто произносятся между действиями.\n\n\nОбязательные микро-реакции:\n— медленное естественное моргание;\n— короткая реакция на прохладу средства;\n— взгляд на собственное\
  \ изображение на экране;\n— естественное глотательное движение;\n— небольшой наклон головы;\n— тихий выдох;\n— запоздалая полуулыбка.\n\n\nVOICE\n\n\nРусский язык.\n\n\nМолодой женский голос.\n\n\nТихий,\
  \ мягкий, немного уставший, близкий к микрофону смартфона.\n\n\nОбычная разговорная громкость. Без дикторской подачи. Без рекламных интонаций.\n\n\nФразы произносить ТОЧНО в указанном порядке и приблизительно\
  \ в указанных временных промежутках.\n\n\nЕстественный русский lip-sync.\n\n\nREALISM\n\n\nМаксимальный уровень фотореализма кожи:\nвидимые поры на носу и щеках, микротекстура лба, натуральные веснушки,\
  \ слабые тени под глазами, небольшой единичный дефект кожи у подбородка, пушковые волосы на щеке, отдельные выбившиеся волоски в контровом свете.\n\n\nГлаза влажные и живые, с естественными бликами. Моргание\
  \ не идеально синхронное и слегка асимметричное.\n\n\nПродукт лежит НА коже как реальное косметическое средство и преломляет свет, но не заменяет текстуру кожи.\n\n\nPHYSICS\n\n\nКосметическая текстура\
  \ ведёт себя физически реалистично в соответствии с референсом.\n\n\nВолосы обладают естественной инерцией, отдельные пряди снова падают к лицу.\n\n\nЛьняная рубашка естественно мнётся и двигается.\n\n\
  \nУпаковка MIXIT имеет реальный вес, правильную перспективу и тени в руке.\n\n\nПальцы анатомически корректны.\n\n\nВсегда ровно две руки и две руки принадлежат одной девушке. Одна рука логически удерживает\
  \ телефон, даже если сама кисть не всегда видна в кадре.\n\n\nSTYLE\n\n\nAuthentic personal UGC vlog.\nModern iPhone selfie look.\nHigh-end photorealism, but zero commercial polish.\n\n\nНе использовать:\n\
  — рекламную постановку;\n— product hero shot;\n— глянцевый beauty-light;\n— идеальную стабилизацию;\n— чрезмерное размытие кожи;\n— ретушь;\n— makeup look;\n— before/after;\n— эффект моментального омоложения;\n\
  — exaggerated glow;\n— инфлюенсерские жесты;\n— указание пальцем на упаковку;\n— демонстративное поднесение продукта к объективу;\n— текст поверх видео;\n— субтитры;\n— captions;\n— дополнительную графику.\n\
  \n\nAUDIO\n\n\nТолько естественный звук комнаты:\n— лёгкий ветер с улицы;\n— далёкие птицы;\n— шорох ткани;\n— тихие звуки упаковки;\n— room tone.\n\n\nБез музыки.\n\n\nOUTPUT\n\n\nVertical 9:16.\nDuration:\
  \ exactly 15 seconds.\nReal-time motion.\nUltra-photorealistic.\n8K detail intent.\nNatural smartphone motion blur.\nSubtle sensor noise.\nSame girl, same wardrobe, same room and same golden-hour lighting\
  \ from first to last frame.\nProduct MIXIT remains identical to @Image2 throughout the video.\nNo additional logos except the original MIXIT branding on the product."
- "Как заставить Seedance говорить по-русски \U0001F43B\n\nКто-то до сих пор думает, что это невозможно, как бы не так! \n\nДля нас в REELY нет ничего невозможного!\n\n1. Весь промпт на английском\nКроме\
  \ реплик. Если смешивать русский и английский в описании сцены, качество заметно падает.\n\n2. Реплики только на русском\nБез транслита, без перевода, без кавычек внутри кавычек.\n\n3. Один персонаж -\
  \ одна реплика\nЛучше так:\nFriend 1:\n\n«Живой?»\n\nFriend 2:\n\n«Не дождёшься.»\n\nЧем:\nFriend 1: «Живой?» Friend 2: «Не дождёшься.»\n\n4. Короткие предложения\nЭто самый важный лайфхак.\n\n❌\nЯ столько\
  \ лет пытался тебя найти и наконец смог.\n\n✅\nЯ искал тебя.\n\n5. Между репликами описывать действие\nНапример:\nFriend 1:\n\n«Живой?»\n\nA short pause.\n\nFriend 2 smiles.\n\n«Не дождёшься.»\nТак модель\
  \ лучше понимает, кто сейчас говорит.\n\n6. Всегда прописывать липсинк\nДобавлять небольшой блок:\nPerfect lip synchronization.\nOnly the active speaker moves their lips.\nNo overlapping dialogue.\nEach\
  \ line is spoken completely.\n\n7. Разделять персонажей максимально сильно\nЕсли персонажи похожи, Seedance начинает путаться, то лучше сразу написать:\n• different ethnicity\n• different hairstyle\n\
  • different body type\n• different clothing\n• different voice\n• never resemble each other\n\n8. Не писать длинные монологи\nЕсли нужна длинная речь, лучше разбить:\n«Я нашёл тебя.»\n\nPause.\n\n«Слишком\
  \ поздно.»\n\nPause.\n\n«Но мы ещё успеем.»\n\nчем одной фразой на три строки.\n\n9. Не злоупотреблять эмоциями\nВместо:\ncries desperately while screaming emotionally…\n\nЛучше:\nspeaks quietly\nили\n\
  shouts\nОдно понятное действие работает стабильнее.\n\n10. Не использовать тире внутри реплик\nЛучше:\n«Я пришёл.»\n\n«Пойдём.»\n\nЧем:\n«Я пришёл — пойдём быстрее!»\n\n❗️Самый неожиданный лайфхак: \n\
  Русский текст лучше оставлять только в диалогах.❗️\n\nВсе остальное - сцена, камера, свет, эмоции, действия, аудио - писать на английском. \n\nЭто один из самых стабильных способов получить качественную\
  \ русскую речь в Seedance. \n\nИменно такой формат сейчас дает лучшие результаты✅\n\nПример промпта оставили в комментариях\U0001F609"
