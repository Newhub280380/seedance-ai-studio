prompts_verbatim:
- "=== https://t.me/reels_by_alsi/762 2026-07-28T13:05:44+00:00\nИнструкция:\n1. Переходим в VeoSeeBot \n2. Нейросеть GPT image 2\nВставляем свое реальное фото в полный рост, референс образа и пишем такой\
  \ промпт \n«Замени одежду на девушке на первом фото на образ из второго фото»\nТак делаем 5-6 разных вариантов, при этом фон везде один и тот же. Также нужно отдельно сгенерировать фото каждой сумки на\
  \ белом фоне. \n\n3. Переходим в Seedance 2.0\nВставляем образ1, сумка1, образ2, сумка2, образ3, сумка3\nИ пишем промпт, который я оставила в комментариях (обязательно подстройте под себя через чат гпт)\n\
  \nИтого у вас есть первая часть 15 сек видео. Точно также генерируете вторую часть, вставляя оставшиеся сумки и образы. Можно брать разные предметы: кепка, очки, часы и тд"
- "28 июля 2026 г., 16:06 МСК\nРеалистичное видео как с телефона на штативе.\n Камера полностью статичная всё видео. Девушка одна и та же, лицо точно как на \n[@лицо]\n, не искажается. Образ меняется только\
  \ тогда, когда \nлетящая сумка полностью заслоняет девушку\n; пока девушка видна, одежда не меняется. Локация: историческая улица с деревянными домами и кирпичным фасадом, точно как на \n[@образ1]\n.\
  \ Фон живой: вдали проходят прохожие, слегка двигаются листья деревьев.\n0–1.5 с:\n видео начинается точно с кадра \n[@образ1]\n, ничего не меняя: девушка в длинном белом платье, бордовой накидке с поясом,\
  \ белом хиджабе, чёрных узких очках, голубых балетках, держит в руках белую сумку, точно как на \n[@сумка1]\n. Слегка приподнимает сумку двумя руками, затем опускает её перед собой.\n1.5–2.5 с:\n короткий\
  \ позинг: нога вперёд, руки вниз с сумкой, уверенный спокойный взгляд.\n2.5–3.5 с:\n берёт белую сумку — точно как на \n[@сумка1]\n — и швыряет в камеру плоским броском с подкруткой.\n3.5–6 с:\n акцент\
  \ — летящая белая сумка. Летит к объективу в быстром вращении, замедляется у камеры, занимает почти весь кадр, полностью заслоняет девушку. Долгий детальный крупный план: гладкая белая кожа, округлая\
  \ форма, толстая ручка с шарообразными элементами, серебристая молния и мягкие блики, точно как на \n[@сумка1]\n. Медленно вращается, показывая себя.\n6–6.5 с:\n продолжая крутиться в ту же сторону, разворачивается\
  \ бумерангом и морфится в плетёную соломенную сумку, точно как на \n[@сумка2]\n. Морф во вращении, образ невидимо меняется.\n6.5–7.5 с:\n плетёная сумка отлетает, крутясь в ту же сторону — девушка в образе\
  \ точно как на \n[@образ2]\n: длинное светло-жёлтое платье, голубой хиджаб, чёрные узкие очки, голубые балетки, держит плетёную сумку. Полёт один: туда и обратно.\n7.5–8.5 с:\n короткий позинг: слегка\
  \ поворачивается корпусом, уверенно держит сумку перед собой, лёгкая улыбка.\n8.5–9.5 с:\n бросает плетёную сумку — точно как на \n[@сумка2]\n — в камеру с подкруткой.\n9.5–12 с:\n акцент — летящая плетёная\
  \ сумка. Летит в быстром вращении, замедляется у камеры, полностью заслоняет девушку. Детальный крупный план: натуральное плетение, длинные коричневые кожаные ручки, объёмная фактура, тёплые солнечные\
  \ блики, точно как на \n[@сумка2]\n. Медленно вращается.\n12–12.5 с:\n разворот бумерангом, морфится в светло-голубую мягкую сумку, такую же как на \n[@сумка3]\n. Морф во вращении, образ невидимо меняется.\n\
  12.5–13.5 с:\n голубая сумка отлетает, крутясь в ту же сторону — девушка в финальном образе точно как на \n[@образ3]\n: серо-голубое длинное платье, белый хиджаб с серой шапочкой, кружевной пояс, серебристое\
  \ колье, массивные кроссовки, держит голубую сумку. Полёт завершается тем, что сумка оказывается у неё в руках.\n13.5–15 с:\n девушка опускает руки с сумкой, спокойно остаётся стоять на месте, уверенно\
  \ смотрит в камеру. Фон продолжает жить, прохожие проходят мимо. Конец.\nКамера:\n строго статичная. Движения камеры, девушки и сумок — раздельно.\nЗвук:\n без музыки, без речи, без субтитров. Городской\
  \ фон, свист воздуха при полёте сумок, мягкий звук приземления сумки в руки."
