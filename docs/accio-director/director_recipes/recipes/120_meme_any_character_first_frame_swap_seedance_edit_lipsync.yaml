title: 'Мем с любым персонажем: скрин 1-го кадра → Nano Banana Pro замена героя → LLM пишет промпт → Seedance Edit с аудио (липсинк и эмоции оригинала)'
intent_tags:
- talking_head
- client_in_clip
- animal
use_when: Видео с реальным человеком и живыми эмоциями (у автора — мальчик с удочкой) → первый кадр перерисовывается в Nano Banana Pro с новым героем (бенгальский кот в той же позе и свете) → LLM по видео
  пишет промпт замены → Seedance Edit с включённым звуком сохраняет липсинк, мимику и движения, меняя героя
inputs:
- видео-референс (движение/клип)
- стартовый кадр
- аудио/голос
steps:
- n: 1
  action: Скачать исходник (бот Save As Bot), сделать скрин первого кадра.
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: user_input
  duration: unknown
  aspect: unknown
- n: 2
  action: 'Nano Banana Pro: скрин + (по желанию) фото персонажа + промпт замены (пример ниже), соблюдать соотношение сторон.'
  tool:
  - Nano Banana
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: unknown
  duration: unknown
  aspect: unknown
