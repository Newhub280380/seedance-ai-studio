  tool:
  - Seedance
  - Gemini
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: previous_step_output
  duration: unknown
  aspect: unknown
- n: 4
  action: Seedance → Edit → нужное разрешение → включить аудио → исходное видео + картинка героя → промпт (проверить, что отметки @ привязались).
  tool:
  - Seedance
  mode: unknown
