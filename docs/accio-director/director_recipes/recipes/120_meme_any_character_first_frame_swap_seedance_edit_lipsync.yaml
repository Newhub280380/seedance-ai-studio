prompts_verbatim:
- "=== https://t.me/profiobzorov/2069 2026-10-22T13:19:17+00:00\nСОЗДАЕМ МЕМЫ С ЛЮБЫМ ПЕРСОНАЖЕМ!\n\nКак выделиться в ленте и собирать миллионы просмотров? \U0001F92D\n\nГлавный секрет - на исходном видео\
  \ должен быть реальный человек с настоящими эмоциями. Как этот харизматичный мальчик. Берем!\n\nИНСТРУКЦИЯ: \n\n1️⃣ Берем видео исходник (предварительно можно скачать через бесплатный бот, например save\
  \ as bot) \U0001F90E Делаем скрин первого кадра видео для замены на вашего героя.\n\n2️⃣ Заходим в SYNTX (на выбор):\n\U0001F4F1 ТГ БОТ SYNTX или\n\U0001F4BB WEB ВЕРСИЯ \n\n3️⃣ В главном меню выбираем\
  \ \U0001F90E \U0001F3A8 Изображения  ▫️ \U0001F34C Nano Banana Pro \U0001F90E  Загружаем скрин из видео и фото вашего персонажа (если нужен конкретный герой). Следом пишем, что мы хотим изменить на изображении\
  \ (обязательно учитывайте соотношения сторон).\n\nПример нашего промпта:\nЗамени мальчика на бенгальского кота. Сохрани фон, свет как на исходном изображении, кот стоит в полный рост и держит лапами с\
  \ мохнатыми пальцами удочку точно также,такой же ракурс качество 4к.\n \n\U0001F4A1 Также вы сами можете сгенерировать изображение для будущего видео с любой локацией и героем.\n\n4️⃣ Далее отправляем\
  \ видео в любимую нейросеть:\nGemini, GPT или Claude (доступно только в WEB версии). И просим написать промпт для Seedance для замены героя видео на вашего.\n\nПример нашего запроса:\nПосмотри и проанализируй\
  \ это видео, я хочу заменить мальчика на бенгальского кота, сохранив локацию. Пропиши мне промпт для нейросети Seedance, должны идеально совпадать липсинг, эмоции на лице, все движения, референсное видео\
  \ в промпте обозначь как @video1, а изображение нового героя как @image1.\n\n5️⃣ Переходим в Seedance \U0001F90E Edit \U0001F90E Выбираете разрешение, которое вам нужно  \U0001F90E Включаем ползунок аудио\
  \ \U0001F90E Загружаем исходное видео и вашего персонажа \U0001F90E Вставляем промпт( следим, чтобы отметки @ встали) \U0001F90E отправляем на генерацию✨ Готово!\n\nТакой прием в контенте подойдёт для\
  \ брендов и экспертов, легко адаптируется под любую нишу. \n\n✔️Подписаться на ТГ КАНАЛ Профи Контента | Нейросети | ИИ\n  \n    Please open Telegram to view this post\n    VIEW IN TELEGRAM"
