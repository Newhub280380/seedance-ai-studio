  Мои настройки:
  • 1080p
  • Длительность -10секунд
  • Формат-9:16
  ⠀
  ПРОМПТ:
  [(@ video1): Original clip — a person standing in an interior room, facing an interior door. Preserve identity, face, wardrobe, body performance, framing, camera position and all original camera motion exactly. Change only what is visible through and beyond the doorway once it opens. (@ image1): Reference photo of the world beyond the door — exact environment, layout, lighting and color grade to use for what is revealed. Use this photo as the literal world being revealed and brought to life; do not invent, redesign or repaint any part of it — animate exactly this scene, whatever it depicts (nature, dungeon, meadow, or any other setting), do not create a new or different world. Specs: Photoreal. Match source clip duration (@ video1). Cinematic grade matching (@ image1) own lighting and color temperature. NON-IP — generic environment design, not based on any specific copyrighted game, film or character assets. SFX and source dialogue only (if any). Action, one continuous shot, same framing as the source: the person reaches for the door handle and opens the door exactly as in the original clip — same hand, same speed, same push or pull motion. As the door swings open, instead of the original room beyond it, the exact world shown in (@ image1) is revealed and brought to life, matching its composition and layout precisely. That world, otherwise static in the photo, now comes alive: whatever environmental elements are present move naturally — foliage sways, water ripples, flames flicker, dust or particles drift, animals shift their weight, light flickers or breathes — appropriate to exactly what (@ image1) depicts, with nothing added that isn't already in the reference photo. Directional light from beyond the doorway spills onto the person's face and body as the door opens, matching the key light direction and color temperature of (@ image1) exactly, with soft contact light wrapping the edge of the doorway and the person's silhouette. The person steps forward through the doorway into this world, their scale and proportions consistent with the environment, and continues walking in as the original camera motion carries through uninterrupted. Face, identity, wardrobe and performance remain unchanged throughout; only the environment beyond the threshold is transformed. SFX: soft creak of the door as it opens, a shift in ambient sound as the new world is revealed, ambience appropriate to exactly what (@ image1) depicts, footsteps as the person steps through.]
