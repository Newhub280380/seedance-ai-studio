  Промпт для Seedance:

  生成16秒、9:16竖屏、单镜头一镜到底、超写实手机夜拍视频。

  整体必须像普通人凌晨在家里随手拍到的真实手机录像，而不是电影、短片、MV或CG动画。不要电影感，不要过度美化，不要稳定器/云台感，不要戏剧化打光，不要广告感。保留真实手机录像应有的轻微手抖、自然自动曝光变化、正常夜景噪点和普通手机动态模糊。

  使用 @Video1 仅用于：镜头运动轨迹、运镜顺序、节奏、取景变化、人物走位、手部动作、表演节奏，以及整段原始说话的时机和口型同步，包括大约12–13秒时最后一句短促的呼喊或招呼声。
  把整支视频当作全新生成的新场景，不要把 @Video1 当作原视频去修补。不要复制 @Video1 里的真实房间、真实墙面、真实窗户、玻璃污渍、真实院子或任何背景细节。

  使用 @Image1 仅用于人物身份：脸型、五官、发型、肤色、面部细节和整体自然长相。人物必须清楚像 @Image1 里的本人，不要美化成另一个人，不要夸张修饰。如果没有使用 @Image1，则人物身份和外貌尽量跟随 @Video1 中出现的人。

  使用 @Video2 仅用于小猫的视觉风格、体型年龄、真实质感、搞笑舞蹈状态，以及那种“手机直闪拍出来”的爆闪真实感。画面里总共3只小猫，三只都必须是同一种风格、同一种年龄段、同一种真实感。不要复制 @Video2 的背景、地面、watermark 或原始构图。

  场景设定：这是一个全新的普通现代公寓，不是现实中的原房间。夜里3点，室内只有微弱温暖的家居灯光，整体安静、生活化、普通。窗户干净透明，没有污渍，没有脏痕。窗外是一个全新生成的普通居民楼小院，不能像现实地点，不能暴露真实环境。

  严格跟随 @Video1 的镜头顺序和节奏：

  0–约2.5秒：镜头对着房间里的一个普通柜子或架子，上面放着一个简单的白色电子数字时钟，屏幕清楚显示“3:00”。不要挂在墙上的钟，要放在柜子或架子上的白色电子钟。

  约2.5–5秒：镜头转向人物本人，进入手持自拍视角。人物看起来有点困、有点懵、有点烦躁，像半夜听到奇怪动静被吵醒的人，表情自然，不表演过度。

  约5–8秒：镜头像 @Video1 一样移动到窗边。保留相同的移动感觉和手持轨迹。移动过程必须完全连续，画面平滑过渡到窗外景象，不能有任何跳帧、突然变清晰、光线突变或剪辑感。从这里开始到视频结束，人物的脸、头、身体不能再出现。

  约8秒到最后那句短促呼喊之前：镜头从窗户看向楼下的小院。院子里有两只很小很小、非常真实的幼猫，正在用后腿站立，跳那种很火的搞笑小猫舞。它们必须像真实幼猫，不是卡通，不是玩偶，不是拟人化角色。它们必须一直持续跳舞，不能提前停下。

  在这两只跳舞的小猫旁边，还有第三只同风格的幼猫，它没有跳舞，而是在“负责拍摄”——它旁边摆着一个小手机，竖着安装在一个迷你三脚架上，正对着那两只跳舞的小猫。

  这三只猫的主要照明来自那个正在拍摄的小手机的直闪/补光，因此整体要有和 @Video2 一样的“夜晚手机闪光灯直拍”效果：前景小猫被直闪照亮，背景小院仍然较暗，呈现出很真实又很荒谬的感觉。

  大约12–13秒，@Video1 中最后那句短促呼喊或招呼声响起的瞬间：保留 @Video1 里的原始说话、语气和时间点。就在这句声音响起时，三只小猫才做出反应：短暂停住（大约半秒），齐刷刷抬头往窗户方向看，气氛有一瞬间尴尬又好笑。反应必须是对这个声音的响应，不能提前发生。

  约13–16秒：三只小猫突然慌了，立刻四脚落地，朝不同方向飞快逃跑。第三只“摄影师小猫”也跟着逃跑，把那个竖着放在迷你三脚架上的小手机留在原地，灯/闪光还亮着。结尾停留在这个荒谬又真实的状态上。

  风格规则：整个视频必须像真实手机拍到的夜间生活片段，搞笑但完全写实。人物是真人写实，小猫是真实幼猫写实。不要童话感，不要动画感，不要CGI小动物感，不要夸张表情包风格。三只小猫必须是统一风格，第三只小猫不能比前两只看起来像另一种模型。窗外场景保持普通居民楼院子的感觉，不要奇幻，不要街景大片感，不要出现其他人，不要出现多余动物。

  音频规则：保留并跟随 @Video1 中原始说话的节奏、停顿、语气和口型，不要翻译，不要改台词，不要重新编写对白。尤其保留最后那句短促呼喊或招呼声的自然时机。

  禁止项：不要复制真实房间和真实院子；不要玻璃脏污；不要卡通猫；不要拟人化猫脸；不要多余路人；不要额外宠物；不要文字（除了时钟“3:00”）；不要水印；不要logo；不要电影级镜头语言；不要慢动作；不要转场；不要分镜切换；不要画面跳帧或突然变清晰；不要只有两只小猫，必须是三只；不要小猫在最后那句短促呼喊之前停下；不要把时钟挂在墙上。
