prompts_verbatim:
- "=== https://t.me/profiobzorov/1992 2026-09-03T14:35:45+00:00\n\U0001F4F7 КАК СДЕЛАТЬ МУЛЬТИКАМЕРУ ИЗ ОДНОГО ВИДЕО?\n\n✅ ПОДПИШИСЬ на этот канал и погнали!\n\nСнимаете видео на телефон с одного ракурса,\
  \ загружаете в нейросеть и получаете видео с 4 разных ракурсов и с готовыми склейками. Да, это возможно. Всё делает нейросеть Seedance.\U0001F44C\U0001F3FC\n\nИНСТРУКЦИЯ:\n\n6️⃣Снимаете видео по вашему\
  \ сценарию с одного ракурса, вырезаем все паузы, оговорки и т.д.\n\nПереходим в SYNTX (куда удобно):\n\U0001F4F1 ТГ БОТ SYNTX или\n\U0001F4BB WEB ВЕРСИЯ\n\n2️⃣ Открываем раздел Текст или LLM-студия. Выбираем\
  \ любимую нейросеть, у нас это Claude Sonnet 4.6. Создаем промпт для Seedance по этому запросу:\n[вставьте в ковычки ваши даннные]\n\nНапиши промпт для Seedance: создание мультикамеры из одного видео\n\
  Исходные данные:\nДлительность видео: [укажи секунды]\nЧто происходит в кадре: [опиши действие, например: \"девушка говорит в микрофон\", \"парень жестикулирует руками\", \"человек идёт\"]\nТребования\
  \ к промпту:\nЯзык: китайский (модель на нём обучена)\nКлючевая формулировка: камера движется вокруг неподвижного человека, это не новая сцена, а другой угол съёмки существующей\nТри обязательных лока:\n\
  Движения: все жесты, позы, мимика покадрово как в оригинале\nВзгляд: человек смотрит в исходную камеру, не следит за новыми ракурсами\nЗвук: оригинальная аудиодорожка, губы синхронны с ней\nКоличество\
  \ ракурсов по длине:\nДо 6 сек → 1 ракурс\n6-10 сек → 2 ракурса\n10-18 сек → 3-4 ракурса\nБольше 18 сек → не делать\nВыбор ракурсов: контрастные по углу и крупности:\nФронтальный средний (установочный)\n\
  Боковой 60° крупный (динамика)\nШирокий с другой стороны (контекст)\nФронтальный ближе (финальный акцент)\nФормат вывода:\nГотовый промпт на китайском с таймкодами и описанием каждого ракурса, который\
  \ можно сразу вставить в Seedance.\n\nКопируем получившийся промпт.\n\n3️⃣ Переходим в раздел Видео\U0001F517 нейросеть Seedance 2.5.\n❗️В настройках выбираем режим Edit.\n❣️Рекомендуем выбирать высокое\
  \ качество (720 или 1080). Чем выше качество – тем реалистичнее получится видео.\n\nОстальные настройки в этом режиме встают автоматически.\n\n4️⃣ Загружаем наше исходное видео и вставляем ранее скопированный\
  \ промпт.\n\nПример нашего промпта для этого видео:\n这是已录制的真实场景，需要创建多机位效果。女孩手持微型麦克风说话，总时长18秒。\n关键：人物动作、表情、视线、声音完全不变，只改变摄像机角度。这是同一表演的不同机位拍摄。\n多机位切换时间轴：\n0-4秒：正面中景\n摄像机在女孩正前方，眼睛水平高度，距离1.5米，可见上半身和手持麦克风\n\
  4-8秒：右侧特写\n摄像机移到右侧60度角，距离0.8米，特写脸部和麦克风，肩膀以上\n8-13秒：左侧中景\n摄像机在左侧45度角，距离2米，中景构图显示更多背景\n13-18秒：正面近景\n摄像机回到正面，距离1米，比开头更近的近景\n每个时间段必须使用指定的机位角度。机位切换要明显清晰。\n锁定要求：\n女孩的所有动作、手势、表情与原视频逐帧一致\n视线方向固定，始终看向原始方向，不跟随新机位\n\
  嘴唇动作与原始音轨完全同步\n每个机位保持稳定，在指定秒数切换到下一个机位\n输出一个18秒的完整视频，包含4次清晰的机位切换。\nОтправляем на генерацию.\n\n\U0001F4A1На этапе генерации промпта вы можете вести диалог с нейросетью и просить вставить свои ракурсы либо\
  \ вносить другие правки. \n\nНо должны сохраняться основные правила:\n\n\U0001F31FГенерация только в режиме редактирования видео Edit\n\U0001F31FПромпт на китайском\n\U0001F31FМаксимум смена 4 ракурсов\
  \ за видео, иначе нейросеть начнет путаться.\n\nСохраняй инструкцию и делись с теми, кому пригодится ✈️\n\nПодписаться на ТГ КАНАЛ Профи Контента | Нейросети | ИИ\n  \n    Please open Telegram to view\
  \ this post\n    VIEW IN TELEGRAM\n  \n\n  \n    Please open Telegram to view this post\n    VIEW IN TELEGRAM"
