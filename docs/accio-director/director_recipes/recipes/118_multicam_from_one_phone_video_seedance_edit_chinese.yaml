- n: 2
  action: 'Текстовая LLM (у автора Claude Sonnet 4.6 в SYNTX; подойдёт любая): вставить мета-промпт «Напиши промпт для Seedance: создание мультикамеры из одного видео» с длительностью и описанием действия
    → получить китайский промпт с таймкодами.'
