title: 'Мультикамера из одного видео с телефона: LLM пишет китайский промпт → Seedance 2.5 Edit (4 ракурса, губы и звук оригинала)'
intent_tags:
- talking_head
- seamless_series
use_when: Снимаешь говорящую голову с одного ракурса → Seedance 2.5 в режиме Edit пересобирает то же выступление с 2–4 разных ракурсов (фронтальный средний → боковой 60° крупный → широкий с другой стороны
  → фронтальный ближе) с жёсткими сменами камеры, сохраняя жесты, взгляд и синхрон губ с исходной дорожкой.
inputs:
- видео-референс (движение/клип)
- аудио/голос
