prompts_verbatim:
- |-
  🧘‍♂️Как создать трендовое видео?

  Переходим в БОТ PromptX

  Шаг 1: Работа с изображениями - Nano Banana 2, загружаем свое селфи фото и этот промпт:
  Ultra-realistic minimalist character reference sheet on a pure white background, styled like a professional fashion photography and movie costume reference board. Left side: full-body front, side, and back standing views of the exact same person. Natural pose, arms relaxed, identical face, hairstyle, clothing, body proportions, and height. Eye-level camera, soft studio lighting, no background distractions.

  Right side divided into two sections:
  Top-right: 6 realistic head reference shots of the same person — front portrait, top/down angle, back of head, side profile, near-side angle, and 3/4 portrait.
  Bottom-right: 6 close-up detail shots — clothing fabric texture, lower outfit detail, tailoring detail, skin texture, eyes/facial details, and shoes.

  Style: ultra-realistic photography, premium fashion editorial quality, clean layout, sharp details, natural skin texture, realistic hair strands, accurate clothing materials, professional character identity sheet.
  Шаг 2: Теперь чтобы сделать такое видео, находим раздел "Создать" и выбираем там "Видео", далее выбираем "Seedance 2.0", загружаем фото (из ШАГ 1) а также загружаем фото одежды, которую можно найти в ПИНТЕРЕСТ и пишем такой промпт:
  Refer to the facial features of the model in @image1. The model, wearing the outfits in the @image2 @image3 @image4 @image5,  gets close to the camera and poses playfully, coolly, cutely, in surprise, and handsomely, with each pose wearing a different outfit.
  *Обязательно выбираем длительность видео не менее 10секунд.
  👉СОЗДАТЬ ФОТО

  🟢VPN в обход белых списков

  🤖 Генерировать такой контент можно здесь:➡️ PromptX
