  ⤷ ПРОМПТ ДЛЯ ВИДЕО:
  Общая задача: Создать кинематографичный драматический видеоролик в жанре криминального неонуара и психологического триллера длительностью ровно 15.0 секунд, с соотношением сторон 9:16.
  Персонажи и ключевые объекты:
  Главная героиня @Image1 — эффектная молодая брюнетка с длинными волосами голивудские локоны, выразительными чертами лица и темным макияжем. Маникюр молочный миндаль, ровный, аккуратный.
  Образ 1 (в помещении): роскошный белый атласный пеньюар с рукавами, отороченными пушистыми белыми перьями, на шее тонкий черный чокер.
  Образ 2 (на задании): облегающие черные кожаные брюки, черная кожаное пальто, черная вязаная шапка-бини, черные кожаные перчатки без пальцев, черные туфли-лодочки на высокой тонкой шпильке.
  Свадебная фотография — квадратный снимок в стиле Polaroid, на котором счастливые улыбающиеся молодожены @image1 @Image2 : главная героиня в белом свадебном платье и темноволосый мужчина в темном классическом костюме.
  Снаряжение — жесткий черный футляр для струнного инструмента (виолончели), скрывающий тяжелую снайперскую винтовку оливково-черного цвета с массивным оптическим прицелом и складными сошками.
  Цели в окне — мужчина средних лет в костюме @Image1 и женщина блондинка @Image3 в вечернем красном платье, пьющие шампанское.
  Посекундный таймлайн (0.0–15.0 с):
  0.0–2.2 с: Темная кухня. Героиня в белом атласном пеньюаре сидит за деревянным столом. В правой руке она держит тлеющую сигарету и выпускает струи дыма изо рта, а левой рукой держит над хрустальной пепельницей горящую полароидную фотографию, наблюдая за языками пламени с холодным спокойствием.
  2.2–3.6 с: Крупный план: горящая свадебная фотография вертикально стоит в граненой пепельнице. Огонь медленно сжигает изображение улыбающегося жениха и невесты, обугливая края бумаги и поднимая тонкий дымок.
  3.6–5.4 с: Нижний ракурс сзади, съемка в движении на уровне асфальта: стройные ноги героини в обтягивающих кожаных брюках и на высоких шпильках уверенно шагают по мокрому пешеходному переходу пасмурного города. В руке она несет черный массивный футляр для виолончели.
  5.4–7.2 с: Открытая плоская крыша с панорамой старого европейского города. Девушка в кожаной пальто стильном и шапке открывает стоящий на парапете футляр, снимает с лица тонкие стильные солнцезащитные очки без логотипа и целеустремленно смотрит вдаль.
  7.2–9.1 с: Средний план сбоку: героиня заняла огневую позицию, приникнув щекой к прикладу оливковой снайперской винтовки и целясь через оптический прицел.
  9.1–10.6 с: Кадр через сетку оптического прицела (POV): темный виньетированный круг с перекрестием и делениями шкалы. В перекрестии — освещенное окно дома напротив. Внутри мужчина и блондинка женщина чокаются бокалами с шампанским и смеются.
  10.6–11.8 с: Ракурс спереди-сбоку: снайпер лежит на сером рубероиде крыши, винтовка надежно зафиксирована на сошках, взгляд героини сосредоточен и неподвижен.
  11.8–12.9 с: Сверхкрупный план (макро): холодный, немигающий взгляд девушки рядом с окуляром прицела, микромимика решимости.
  12.9–13.9 с: Макроплан на спусковой скобе винтовки: ухоженный палец в черной кожаной перчатке плавно и непрерывно давит на спусковой крючок.
  13.9–15.0 с: Спусковой крючок дожимается до упора, момент выстрела с отдачей и резкое кинематографичное затемнение в глубокий черный цвет.
  Камера, свет и стиль: Кинематографичная глубина резкости, переменный фокус, пасмурная холодная серо-синяя цветовая гамма города контрастирует с теплыми вспышками огня на фото и золотистым светом в окне жертвы. Динамичный, ритмичный монтаж.
  Звуковое сопровождение: Меланхоличная тревожная электронная музыка с женским вокалом, шелест огня и затяжка сигареты, цокот каблуков по влажному асфальту, порывы ветра на крыше, механический глухой щелчок спускового крючка и резкий глухой выстрел, сменяющийся по лной тишиной в финале.

  Негативный промпт:
  Мультяшный стиль, 3D анимация, переэкспонированные цвета, лишние пальцы, деформация оружия, дрожащие контуры, размытые лица, внезапное появление лишних людей.
