    # Background Replace v3 LoRA (summary)


    [](https://github.com/NyckM/Bruxosdovfx-SyncTile-MiniMax-H3-v5.4/tree/main#background-replace-v3-lora-summary)


    Experimental merge of **five LoRAs by other authors** for MiniMax H3 (not an original training). Download: [Background Replace v3.safetensors](https://huggingface.co/NyckM/Background_Replace_Minimax_H3/blob/main/Background%20Replace%20v3.safetensors)
    → `models/loras/minimax/`. BF16, \~1.91 GB, rank-concatenation merge (no SVD); no metadata (credits live in this README). Components and weights: Facial Realism CloseUp — prithivMLmods (1.0); H3 Character
    Swap — Akatz Labs (1.0); Realism People — Lovis Odin / fal (1.0); Head Swap v1.0 r32 — Alissonerdx / Alisson Anjos (0.2); VFX Edit v1.0 r128 — Alissonerdx / Alisson Anjos (0.2). Links in the table in
    the Portuguese section. Base model: [MiniMax H3 — MiniMaxAI](https://huggingface.co/MiniMaxAI/MiniMax-H3). Load from your LoRA folder at strength **1.0**. It mixes FL2VA and REF2VA sources; the name
    does not guarantee background replacement. The exact Character Swap version is unconfirmed (metadata says v2, deltas resemble v1.5). Structure validated, **not yet tested in generation**. The source
    models'' licenses apply; credits do not imply the authors endorse the merge.


