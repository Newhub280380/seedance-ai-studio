  ### comments nercpa/322
  --- Нейросетка |Промты | Обновления Chat
  TASK & FORMAT
  A 20-second photorealistic cinematic video, one continuous FPV-drone flight with no cuts. On a snowy mountain road, living black smoke steals an emblem, thrashes in a wild shapeless cloud, and the car from @image1 slowly materializes out of it from front to rear as the smoke streams away; the drone makes one slow full circle around it and ends in front as the headlights come on.

  REFERENCES
  @image1 = the car, a reference sheet of one car: the revealed car matches it 1:1 in every frame — body, paint color, grille, badges, headlights, wheels, taillights, exhaust. Combine the views into ONE car.
  @image2 = the emblem: exactly its shape, colors, material and lettering as shown on @image2, in every frame where it appears.

  LOCATION & WEATHER
  A two-lane mountain road covered with packed snow and ice, snowy slopes and dark pine trees on both sides, rocky snow-covered mountains clearly visible behind under a heavy overcast sky. A steady snowstorm: falling snow and wind blowing powder snow low across the road. The environment is almost monochrome — grey, white and black; the only colors are the emblem, and later the car's own paint and its red taillights. The whole video stays on this stretch of road. Real-time speed, no slow motion.

  THE SMOKE
  Real black smoke, extremely dense and dark, like thick smoke from burning oil — matte, opaque in its core, with soft, blurry, constantly churning edges and fine curling wisps that the wind tears off and carries away. It is made purely of smoke: it has no hair, no fibers, no fur, no fabric texture. It stays compact and low, hugging the ground — never big billowing puffy clouds, never an explosion, never a vertical column or tornado. Never liquid, no gloss, no drips.

  TIMELINE
  0.0–1.0s — THE CHASE
  The FPV drone flies fast and low over the snowy road, just above the snow. Long trails of dense black smoke whip past the lens on both sides, racing in the same direction. Far ahead in the middle of the road, a tiny glint of the emblem.

  1.0–2.0s — THE EMBLEM
  The drone slows down and stops low, at snow level, close in front of the emblem from @image2 lying on a small heap of clean white snow in the middle of the road, its colors and lettering exactly as on @image2. A dark mass of churning black smoke hangs above it at the top of the frame. The emblem lies on clean snow, never on smoke.

  2.0–3.5s — THE CLAW
  From the smoke above, a claw formed out of dense black smoke slowly descends toward the emblem: four or five long, curved, sharp smoky talons spread wide over it, their edges smoking and dissolving, hovering for a moment.

  3.5–4.0s — THE GRAB
  The smoky claw closes around the emblem and pulls it up into the smoke, where it disappears; at once the black smoke rushes over the lens, covering the whole frame for a moment.

  4.0–7.0s — THE BRAWL
  The drone pulls back to medium distance. On the road a wild, ragged, chaotic cloud of black smoke thrashes non-stop for the whole three seconds: smoky shapes like limbs and claws lash out of it and strike at each other, tendrils whip up and fall back, the cloud tears apart and slams back together, bulges and collapses, its outline completely different every moment. It never calms down, never settles and never takes any smooth, rounded or car-like form.

  7.0–7.5s — THE GATHERING
  The thrashing smoke pulls together into one low, ragged, uneven mass of churning black smoke on the road, still boiling and tearing at its edges, with no recognizable shape — and immediately the car begins to appear inside it.

  7.5–12.0s — THE CAR MATERIALIZES, ORBIT BEGINS
  The drone starts one slow, smooth, continuous orbit at medium distance: from the front, around the side, toward the rear. The car slowly materializes out of the smoke, strictly from front to rear, one area at a time:
  - first, deep inside the front of the cloud, the grille appears as a faint dark shape, then gradually becomes solid and glossy, with the car's own badge exactly as on @image1;
  - then the headlights and the bumper slowly emerge in the same way, then the hood;
  --- Нейросетка |Промты | Обновления Chat
  - then the front wheels, the windshield and the doors;
  - then the rear wheels and the rear of the body.
  Each area first shows as a dim, half-formed dark shape inside the smoke and then hardens into solid, glossy metal in the car's own paint color as the smoke streams backward off it in the wind. Everything still inside the smoke stays completely hidden — only dense opaque smoke is seen there, never a car outline. Already materialized parts stay solid and final; no part ever floats separately, no gaps in the body.

  12.0–16.0s — THE REAR AND THE OTHER SIDE
  The drone passes behind the car: the rear materializes last, the last smoke streams off it, and the red taillights light up. It keeps circling around the other side back toward the front. Only thin black smoke still drifts over the roof, curling in the wind.

  16.0–17.0s — THE HEADLIGHTS
  The drone completes the circle and settles low in front of the car. The headlights flash on.

  17.0–20.0s — THE FINAL BREATH
  The car stands still, clean and glossy, front facing the camera, thin black smoke curling over the roof. At 18.0s the engine roars once: dense black smoke suddenly swells up again over the roof and the hood and a low wave of black smoke rolls out around the car along the ground — then within a second it thins back to a few wisps over the roof. The car never moves. End on it in front of the camera, headlights piercing the snow.

  CAR ORIENTATION
  The car stays in one place with a fixed orientation from the moment its first part appears to the end; it never rotates, flips or moves. Different sides are seen only because the drone circles it.

  CAMERA
  One FPV drone, one continuous flight, one wide lens, no zoom. Slight natural shake and small corrections in the wind. Fast and low at the start; still and low at the emblem; one slow, smooth, full 360° orbit at medium distance around the car, keeping the whole cloud and car in frame and returning exactly to the front — no jumps; ends hovering low in front of the car.

  LOOK
  Photorealistic cinematic image, cold desaturated grey-blue tones in the environment, soft overcast light, real snow texture. Matte dense black smoke and glossy car paint in the car's true color from @image1; the emblem, the car's own color and the red taillights are the only colors in the frame.

  AUDIO
  No music, no speech.
  Wind and blowing snow throughout; a low rushing hiss as the smoke trails fly past; a light metallic clink as the claw grabs the emblem; muffled thuds and growling rumbles during the brawl; a soft continuous hiss and small metallic ticks as the car materializes; a deep electric snap as the headlights come on; at 18.0s one deep engine roar with the swell of the smoke, then a low idle.

  NEGATIVE
  an emblem in different colors than on @image2, a red emblem unless it is red on @image2, the emblem from @image2 placed on the car, an oversized emblem on the grille, the car's paint color changed or desaturated, the smoke calming down before the car appears, a smooth dome of smoke, a rounded or oval cloud, a box-shaped cloud, a smoke sculpture of the whole car, the whole car silhouette visible in the smoke before it materializes, a car-shaped smoke cloud, the car appearing all at once, fur, hair, wool, fluffy or hairy texture, plush, animal paws, furry creature, car parts forming separately, floating car parts, a grille or bumper frame hanging alone in the air, gaps or missing sections in the body, the emblem lying on smoke instead of snow, big billowing puffy clouds, explosion smoke, a vertical smoke column or tornado, close-up macro shots of single parts, the camera jumping from the rear to the front, an incomplete orbit, the car rotating or moving, a car different from @image1, liquid or glossy smoke, cuts, zoom, slow motion, a white-out blizzard hiding the mountains, music, speech, text, subtitles, watermarks
