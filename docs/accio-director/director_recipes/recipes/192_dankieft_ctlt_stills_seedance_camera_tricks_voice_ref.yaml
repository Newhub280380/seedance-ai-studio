prompts_verbatim:
- "02\nThe CTLT method\nThink in four parts\nCamera → Tone → Lighting → Texture. In that order, camera first\nFill in one sentence per part, that's your prompt\nGrab the template: \nFile → Make a copy\n\
  . The LLM helper is at the bottom of it\nThe blank table\nExample: skeleton running\nFlux 2.0 Pro. Just the four sentences from the table, pasted in.\nCopy prompt\nGenerate on Higgsfield\nCopy & open\
  \ Higgsfield\nCamera: Candid 35mm film photograph with a 12mm fisheye lens, slightly elevated side view, wide full-body framing, tilted horizon and slight motion blur.\nTone: Frantic, absurd and darkly\
  \ comic, like an unexpected chase caught by a passerby. A skeleton wearing a dress made of raw meat sprints down a Los Angeles street at night, with three dogs chasing close behind.\nLighting: Harsh direct\
  \ on-camera flash lights the skeleton and nearby dogs, casting hard shadows across the asphalt while the parked cars and street behind them fall into darkness.\nDetails: Matte ivory bones, glossy marbled\
  \ meat with visible fat and uneven edges flapping with each stride, coarse dog fur, rough asphalt and visible film grain.\nShow full prompt\n...\n04\nThe idea and levels of contrast\nStart simple, then\
  \ add something unexpected\nLevel 0: a robot in a factory. That's what you'd expect\nLevel 1: same robot at a charging station with a low battery\nLevel 2: give him diamonds and a rapper attitude. Now\
  \ he has personality\nLevel 3: put that iced-out robot in flowers, powered off. Hard metal, soft flowers. Different feeling\nLevel 0 → Level 3\nAll Nano Banana Pro with Bruiser's character sheet. Each\
  \ one builds on the last."
