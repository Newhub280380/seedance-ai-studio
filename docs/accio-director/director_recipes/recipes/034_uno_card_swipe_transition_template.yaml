prompts_verbatim:
- |-
  🚨 1 REFERENCE VIDEO. 3 REPLACEABLE VARIABLES. 50 CHANCES AT 1,000,000 VIEWS FROM THE SAME UNO SWIPE

  15 seconds. An empty location. One character walks straight into the lens, flashes two UNO cards, swipes them across the camera and suddenly a vehicle appears behind them.

  That card swipe is the whole trick.

  For a fraction of a second the lens is completely covered, giving the AI a perfect place to hide the reveal. The character stays consistent, the camera stays locked, the timing stays locked, and everything behind the cards can change.

  You have 3 replaceable variables: the character, the vehicle and the location.

  A founder + company car + headquarters. A creator + supercar + Tokyo penthouse. A dealership owner + new model + showroom. A mascot + spaceship + Mars. A musician + motorcycle + backstage.

  Same 15-second skeleton. Completely different video every time.

  Run 10, 20 or 50 combinations and you are giving one proven transition 50 different chances to catch an audience and hit 1,000,000 views.

  You need 4 files: the reference video, one character image, one vehicle image and one location image. Use Wan 3.0 and upload them in that order. Settings: 16:9, 15 seconds. Use 480p for cheap tests, then render the final version at 720p or 1080p.

  I’m giving you the exact prompt:

  PROMPT

  [Recreate @Video1 exactly 1:1 - the same wide-angle locked-off camera at chest height, the same framing, strong lens distortion, timing, every action, gesture and the card-swipe transition, and the original audio. Change ONLY three things: the character, the vehicle and the location. REPLACEMENT STARTS AT THE VERY FIRST FRAME (0.0s). From frame one the room is already the location from @Image3, the character is already the one from @Image1, and when the vehicle appears it is already the one from @Image2. The original woman, the original pink car and the original parking garage are never visible, not for a single frame. No morphing, no gradual transition. THE CHARACTER - @Image1, 1:1. It can be anything: a person, animal, creature, dragon, robot, cartoon figure. It completely replaces the woman in the pink blazer. Identical to @Image1 in every frame and from every angle: species, body type and proportions, head, face or muzzle, eyes, skin, fur, scales, feathers or surface material, colors, markings, hair, and all clothing, armor and accessories. Parts not visible in @Image1 are completed naturally in the same style. Nothing of the original woman remains (no blonde hair, pink outfit, pearls, sunglasses, heels, human body) unless it is in @Image1. THE VEHICLE - @Image2, 1:1. A car, motorcycle, spaceship, carriage, throne or any object. It completely replaces the pink convertible: exact shape, size, paint or material, wheels, lights, trim, roof, interior, identical from every angle. It stands where the original car stood: left of center, at the same angle, near side facing the camera. Nothing of the original car remains. THE LOCATION - @Image3, 1:1. It completely replaces the underground garage: the same architecture, walls, floor, ceiling, columns or furniture, colors, light sources, props and atmosphere, seen through the same wide-angle camera looking into the room with open floor in the middle. Nothing of the original garage remains (no concrete pillars, red stripes, red floor markings, fluorescent lights) unless it is in @Image3. Lighting, shadows, reflections and color grade come from @Image3; the character and vehicle are lit by it with matching shadows and perspective. Each element keeps the look it has in its image, and all three blend into one coherent shot with consistent light, scale and perspective. THE CHARACTER PERFORMS EXACTLY THE ORIGINAL ACTIONS AND TIMING (translate each action to its body: hands become paws, claws, wings or tentacles; walking becomes flying, hopping or crawling if more natural; speech keeps the same mouth movement and rhythm as @Video1, as words or the character's own sounds): 0.0-0.5s - the room is empty. 0.5-2.0s - the character enters from the right and confidently heads toward the camera. 2.0-4.0s - it stops very close to the camera, upper body or head filling the frame, and talks to the camera with a self-assured, playful attitude, one hand gesturing toward the lens at about 2s. 4.0-5.0s - it raises a fan of two bright game cards (green with a "2", yellow with a "4") and swipes them right across the lens, covering the camera; the swipe fills the lens at 5.0s - this is the transition. 5.0-7.6s - the cards are gone and the vehicle from @Image2 now stands behind it; it looks at the camera seriously, then grins, gestures proudly toward the vehicle, and turns its head toward it. 7.6-9.5s - it turns and walks to the vehicle. 9.5-10.8s - it reaches the vehicle's near side and opens the door. 10.8-13.0s - it gets in and sits down behind the wheel, closing the door. 13.0s to end - it sits in the driver's seat, the vehicle standing still; the room is calm. ADAPTATION RULES. Keep real proportions between @Image1, @Image2 and @Image3. If the vehicle has a door and seat and the character fits, it opens the door, sits behind the wheel and closes it. If not, or if the sizes differ greatly (a dragon beside a small car, a tiny creature beside a truck), the character does the closest natural equivalent in the same time window: sits on, perches on, climbs onto, curls around or rests beside the vehicle, ending calm in the same place in frame. If the character cannot hold cards, it holds the fan in its mouth, claws or beak, or the cards float beside it. Shot sizes stay as in @Video1: very close from 2.0 to 5.0s, full body in the wide shot from 7.6s. Everything except the character, the vehicle and the location stays exactly as in @Video1. Realistic textures, reflections and shadows. 16:9, 15 seconds. No text except the numerals on the cards, no logos, no watermarks, no subtitles.]

  Now replace the character, vehicle and location and run it again.

  One reference gives you dozens of combinations without rebuilding the camera, timing or transition from scratch. Every new set of inputs becomes another shot at the algorithm while the viral skeleton stays intact.

  The UNO swipe gets the replay. The reveal gets the share. The three replaceable variables are what turn one 15-second clip into a production pipeline.

  The article below breaks down the full Content Factory system - lock the structure, make the variables replaceable and keep producing from the same system.
