- |-
  A cinematic luxury 15-second vertical 16:9 CGI advertisement.

  STYLE: ultra realistic premium CGI, Apple-level product advertising, macro cinematography, shallow depth of field, golden warm reflections, hyper-detailed mechanical realism, cinematic lighting, volumetric light rays, 8K.

  CORE IDEA:
  The camera begins outside a luxury Rolex watch and dives inside the mechanical world where miniature elite engineers are building and maintaining the movement like a giant industrial megastructure.

  SHOT 1 (0:00–0:02) — HERO INTRO / PRODUCT RECOGNITION
  Start with a clean, premium studio shot of a Rolex Submariner watch. Black background. Soft controlled lighting. Strong reflections on sapphire glass. Rolex branding clearly visible. Slow cinematic push-in toward the watch face. Suspense building.

  CUT FEEL: smooth macro zoom into the glass surface.

  SHOT 2 (0:02–0:04) — TRANSITION INTO MICRO WORLD
  Camera pushes through sapphire crystal glass as if entering another dimension. Optical distortion, refraction, cinematic warp transition. The watch face becomes a massive mechanical landscape.

  We fully enter the interior world of gears and steel structures.

  SHOT 3 (0:04–0:07) — INSIDE MECHANISM WORLD REVEAL
  A vast golden mechanical universe inside the watch movement. Giant interlocking gears rotating slowly. Ruby bearings glowing faint red. Polished steel bridges like skyscrapers.

  Miniature elite engineers in clean industrial uniforms operate cranes, tools, and scaffolding systems. Everything is precise, controlled, engineered.

  Camera performs a slow aerial glide revealing scale.

  SHOT 4 (0:07–0:10) — HERO ACTION MOMENT (CRANE SEQUENCE)
  Focus on a miniature high-precision crane lowering a glowing ruby jewel bearing into the exact position inside the mechanism.

  Engineers coordinate the operation with hand signals and ropes.

  Slow motion emphasis on precision placement. Mechanical alignment clicks perfectly into place.

  Satisfying engineered motion.

  SHOT 5 (0:10–0:13) — DETAIL + LIFE INSIDE MACHINE
  Extreme macro shots of gears turning. One engineer polishing golden metal surface. Dust particles floating in warm light beams. Micro movements of machinery synchronized like a living organism.

  Camera slowly tracks across moving gear teeth.

  SHOT 6 (0:13–0:15) — ESCAPE / FINAL HERO MOMENT
  Camera rapidly pulls back through the mechanism, exiting through the sapphire glass.

  We return to the original Rolex watch hero shot.

  Watch stands still in perfect silence.

  Final hold on product. Luxury feeling. Clean finish.
