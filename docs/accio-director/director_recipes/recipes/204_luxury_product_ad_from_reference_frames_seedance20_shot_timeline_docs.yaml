  Shot 1 (0:00–0:02):
  Complete darkness. A single thin white rim light slowly reveals the silhouette of a premium titanium smartphone standing vertically. Absolute black background. The phone occupies only a small portion of the frame with generous negative space. Locked camera. Very slow push in. Silence and anticipation.
  Shot 2 (0:02–0:04):
  Extreme macro of the brushed titanium frame. Soft studio light slowly slides across the satin metal texture, revealing fine machining details. Ultra shallow depth of field. Black background. Macro dolly movement following the edge of the device.
  Shot 3 (0:04–0:06):
  Extreme macro of the triple camera module. Crystal-clear lens glass. Elegant white studio reflections moving naturally across the surface. Precision-machined metal rings. Slow focus pull between the lenses. Minimal movement.
  Shot 4 (0:06–0:09):
  The device begins emerging from smooth transparent liquid-glass waves. The glass flows gracefully around the phone without splashing. Soft reflections ripple across the surface. White volumetric light gently illuminates the scene. Slow orbit begins around the product.
  Shot 5 (0:09–0:12):
  Medium shot. The smartphone floats weightlessly in a dark studio environment. It slowly rotates approximately 30 degrees, revealing its titanium frame and perfectly polished glass. Reflections glide naturally across every surface. Camera continues a smooth cinematic orbit.
  Shot 6 (0:12–0:15):
  Final hero shot. The phone stops perfectly centered. Thin white rim light defines every edge while the rest of the frame remains deep black. Very slow push in. Hold on the product for the final seconds. Premium Apple keynote aesthetic.
