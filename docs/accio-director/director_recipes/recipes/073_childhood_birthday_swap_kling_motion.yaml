prompts_verbatim:
- "\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\U0001F520\n\nИнструкция:\nСначала снимаем себя на камеру, как сидим за столом, смотрим на торт и удивляемся. Потом делаем скрин из этого видео,\
  \ желательно где вы смотрите прямо в камеру. \n\n1. Переходим в VeoSeeBot \n2. Nano banana Pro\nВставляете скрин из видео, ваше детское фото, фото торта со свечами и пишите запрос:\n«Замени человека на\
  \ первом фото на ребёнка из второго фото. На столе стоит торт с зажженными свечами, как из третьего фото»\n\n3. Kling 3.0 Motion\nВставляете получившееся фото, где вы уже как ребенок. Также прикрепляете\
  \ отдельно видео, которое вы сняли изначально. Пишите похожий запрос: \n«вместо девушки ребенок»\n\nДальше остается 2 части соединить в капкате и наложить ваши детские фотографии, как у меня в примере.\n\
  \nЕсли хочешь ещё больше погрузиться в мир нейросетей и создавать необычный контент, то приходи на мое обучение по ИИ. Подробная информация в этом посте."
