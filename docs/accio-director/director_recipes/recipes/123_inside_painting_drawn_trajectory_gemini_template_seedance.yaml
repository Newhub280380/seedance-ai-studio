  ### comments profiobzorov/1934
  --- ЧАТ Профи Контента
  Промпт для Gemini:
  You are an elite AI video prompt engineer. I am giving you an image of a painting. I have manually drawn a trajectory line/arrow on it.
  YOUR GOAL: Translate this drawn 2D line into a highly descriptive, physical 3D camera movement inside a volumetric space. The video AI (like Seedance) usually tries to treat paintings as flat 2D images. Your prompt MUST force the AI to treat this as a real physical movie set with deep Z-axis depth.
  CRITICAL RULES:
  ERADICATE THE LINE: The drawn line/arrow is ONLY for your understanding. Explicitly command the AI to remove it.
  3D VOLUME: Translate the arrow's curve into an orbit, dolly, or arc. If the line goes around a person, describe how the camera reveals their back/side and how background objects shift.
  EXACT FORMAT: Use the exact structure below. Output ONLY the final prompt in English. No conversational text.
  USE THIS EXACT TEMPLATE AND TONE:
  FIRST FRAME: exactly the reference image, full composition, untouched. NO drawn lines, NO arrows, NO trajectory marks from the reference - they must be completely absent. The shot opens on this identical framing and the camera is already easing into motion from the very first frame. It never holds, never hovers.
  The reference image is a REAL 3D PHYSICAL SPACE with massive depth. [Describe the room/environment: specify what is the foreground, midground, and background wall. Explicitly state this is a 3D space, solid bodies on a real floor, NOT a flat picture.]
  Preserve everything exactly: [Describe the characters, their poses, clothes, objects, colors, lighting, and original art style/brushwork in extreme detail]. Faces, proportions, costumes, props, scale and layout never change.
  CAMERA, one unbroken [X] second orbit/arc, no cuts, one direction only:
  [Look at my drawn arrow. Describe the camera travelling deep into the Z-axis. Example: "The camera arcs right and forward, curving around the subject, crossing the plane the figures stand on and passing behind them. Their backs turn toward the lens while the background sweeps away." Translate the arrow into physical spatial movement through the room].
  CAMERA RULES: one direction the entire time based on the trajectory. Never reverses. Never zooms in and out (NO digital zoom). No push-pull, no crash zoom, no whip pan, no snap, no shake, no flat panning. Speed eases in over the first half second, builds through the middle of the arc. Momentum, not urgency. A physical camera moving through real volume.
  CAMERA FEEL: a real gimbal on a moving dolly arc, not a CG rail. Organic, not robotic. Deep spatial penetration into the scene.
  PARALLAX IS THE POINT: every layer must separate at a different rate as the camera moves. [Explicitly list what occludes what. E.g., "The foreground object moves fastest, blocking the midground character, while the background wall shifts slowly." Describe how angles change in 3D]. This is a solid room being circled, not a flat image being warped.
  The only motion in the scene: both figures breathe slowly and blink once, flame flickers gently, heavy fabrics settle a fraction. Nothing else moves. Nobody turns, gestures or changes expression. No morphing, stretching, melting or reshaping of faces, hands, bodies or objects. If a detail rotates out of view it simply leaves frame, it is never invented or reshaped.
  Cinematic, 24fps, shallow depth of field with focus riding the subjects, filmic grade the original palette, fine grain, no colour shift. No captions, watermarks or on-screen writing. No music, foley only, faint room tone.
