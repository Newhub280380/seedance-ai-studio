prompts_verbatim:
- |-
  ##### listing-reel-earth-zoom | Listing photos to a real-estate reel
  What you provide
  Listing photos (exterior first, then 2 to 4 rooms) (image)
  The property, in one line (text)
  The search bar line (Your dream home in Scottsdale) (text)
  What Sensei does
  A search-bar intro that types the dream
  An earth zoom from orbit to the front door
  A slow camera move through each room
  Crossfades and music, vertical and ready to post
  The brief Sensei follows
  Make a vertical 9:16 real-estate reel for {{property}} from the photos in {{listing-photos}} (exterior first, then rooms). 1) Intro on Seedance 2.5 at 1080p, 4 seconds: a clean white search bar on a warm gradient types "{{search-line}}" letter by letter, then the camera pushes into it, keyboard clicks and a whoosh. 2) Make a still of Earth from orbit centred on the property's region on Seedream 5, then a 5-second Seedance 2.5 shot with that still as the first frame and the exterior photo as the last frame: one unbroken, accelerating zoom from space down to the front of the home. 3) Animate each room photo on Seedance 2.5 for 5 seconds with one slow, steady camera move, nothing added or removed; reject any take where walls or furniture warp. Cut everything in order with half-second crossfades over warm acoustic music, faded out at the end.
- |-
  ##### listing-video | Listing video from room photos
  What you provide
  Room photos, in tour order (3 to 6) (image)
  The property, in one line (text)
  What Sensei does
  A slow camera move for each room
  Warps checked, bad takes redone
  Warm music and crossfades between rooms
  The brief Sensei follows
  Make a 16:9 listing video of {{property}} from the room photos in {{room-photos}}, in the order given. Animate each photo on Seedance 2.5 for 5 seconds with one slow, steady camera move that suits the room (glide forward, gentle pan, slow rise), no people, nothing added or removed, light moving softly. Reject any take where furniture or walls warp. Make a warm instrumental track on Seed Audio (acoustic guitar and soft piano). Join the rooms with half-second crossfades, about 4 seconds each, music faded in and out.
