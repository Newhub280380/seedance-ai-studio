prompts_verbatim:
- |-
  Сделай эталонную иллюстрацию для образовательного проекта про [ваша тема]. Один объект по центру на однотонном фоне, три четверти, мягкий рассеянный свет сверху слева, лёгкая тень под объектом. Стиль: чистая научная иллюстрация, ограниченная палитра из четырёх цветов плюс фон, без градиентных переливов, без надписей и подписей в кадре, без рамок и интерфейса. Уровень детализации: видны основные части объекта, мелкая фактура не прорисована. Пропорции квадрат. Это эталон, по которому дальше будет нарисована целая серия, поэтому стиль должен легко повторяться на других объектах.
- |-
  Нарисуй [название объекта] в том же стиле, что на приложенной эталонной картинке. Сохрани палитру, тип освещения, ракурс три четверти, однотонный фон и уровень детализации. Меняется только сам объект. Ни надписей, ни стрелок, ни выносок в кадре.
- |-
  Собери одностраничное веб-приложение - интерактивный трёхмерный обозреватель по теме [тема]. В папке лежат модели в формате glb и эталонная картинка стиля. Интерфейс делай в стиле этой картинки: палитра, воздух, шрифты. Что должно быть: - список объектов слева, при выборе загружается модель - сцена: вращение мышью, приближение колесом, кнопка сброса, автовращение при бездействии - интерактивные точки на модели: при клике всплывает карточка с названием части и пояснением в две строки - панель фактов справа: размер, вес, расположение, функция - переключатель слоёв и режим разреза - на телефоне список сворачивается, сцена остаётся управляемой Требования к производительности, они обязательны: - каждая модель весит не больше 6 МБ, при необходимости упрощай геометрию и сжимай текстуры - модели грузятся по требованию, а не все сразу при открытии - первый экран открывается меньше чем за 2 секунды - сцена держит 50 кадров в секунду на среднем ноутбуке - если модель ещё грузится, показывай индикатор, а не пустоту Порядок: сначала опиши план в десяти строках и дождись моего согласия. Потом собери, запусти, замерь вес ассетов и кадры в секунду, выведи цифры. Если не укладываешься в требования - оптимизируй и замерь снова.
- |-
  Замерь текущий вес каждого ассета и суммарный вес того, что грузится при открытии страницы. Выведи таблицу. Дальше приведи это к следующему: не больше 6 МБ на модель, не больше 15 МБ на первый экран, остальное по требованию. Средства по порядку: упрощение геометрии, сжатие текстур, формат с компрессией, ленивая загрузка, индикатор ожидания. Визуальное качество на глаз не должно заметно упасть - после каждой оптимизации показывай, что именно изменилось. После всего замерь снова и выведи таблицу «было - стало».
