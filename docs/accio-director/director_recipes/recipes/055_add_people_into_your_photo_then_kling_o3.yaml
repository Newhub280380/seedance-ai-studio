- "\U0001F973Miyagi & Эндшпиль с тобой\nВыберете любое фото с ребятами.\n\n1️⃣Загружаем свое фото и выбранное фото с парнями в бот \n2️⃣Пишем промт(для фото в авто):\nДобавь меня между мужчинами на фото,\
