  \ в поле:\nДобавь меня третьим человеком на фото, расширь фото справа и добавь меня туда, сохрани общий стиль и атмосферу кадра, добавь мне на голову черную Панаму и черные очки.\n3️⃣Загружаем готовое\
  \ фото снова в бот\n4️⃣Выбираем видео- режим kling o3 pro \n5️⃣Промт для кадра в авто:\nОживи видео,люди едут и качают головой под музыку,на 3 секунду камеру начинает снимать с пассажирского окна,людей\
  \ видно в профиль\n\nПромт для кадра в поле:\n3 человека стоят в поле, дует сильный ветер с пылью, они качают медленно головой под музыку. Смотрят в камеру, затем в сторону.\n\n\U0001F445Не бойтесь писать\
  \ промт, самостоятельно подгоняйте его под нужные обстоятельства\n#miyagi #Эндшпиль #Kling #Nanobanana\n\n\U0001F916 Генерировать такой контент можно здесь➡️\n@AiGraff_bot"
- "\U0001F60EMiyagi и Эндшпиль страхуют.\n\n#AIвидео #Kling #NanoBanana #нейросети #промтMiniApp\n\U0001F973На примере видео, которое мы сделали для https://www.instagram.com/mari_fittttttttt подписывайтесь\n\
  \n❤️Можем сделать на заказ. Генерации + монтаж как в примере. Стоимость: 1000₽ Пишите @ai_miniapp_chat\n\nВот пошаговая инструкция.\n1️⃣ Загружай исходные фото в \U0001F449бот\nЗагрузи 3 фото:\n• ты в\
  \ спортзале\n• 2 фото парней (приложили в закрепе)\n2️⃣ Открывай редактор и выбирай Nano Banana pro, 4к, 9:16, вставь промт:\nИспользуй первое изображение как основную сцену (девушка в спортзале).\nИспользуй\
  \ второе и третье изображения как референсы двух парней.\nЕстественно добавь этих двух парней в сцену.\nОни входят в кадр слева и идут в сторону девушки.\nДевушка выполняет жим гантелей вверх.\nНе изменяй\
  \ её лицо, тело и позу.\nПарни должны максимально точно сохранить свою внешность: лица, одежду, пропорции.\nСвет, тени и перспектива должны соответствовать исходному спортзалу.\nБез искажений и смены\
  \ стиля.\nКамера статична.\nРеалистичный кинематографичный стиль.\n3️⃣ Получи готовое фото, если не нравится как генерирует нано банана, можно попробовать gpt или seedream с тем же промтом\n4️⃣ Загружай\
  \ фото заново\nИспользуй его как основу для видео.\n5️⃣Открывай редактор\nВыбери Kling о3 pro 9:16 и вставь промт:\nКамера статична. Реалистичная обстановка спортзала.\nДевушка выполняет жим гантелей\
  \ вверх.\nДва парня подходят к ней слева.\nОдин парень останавливается справа от неё и страхует.\nВторой парень встаёт сзади, немного приседает и помогает ей выполнять упражнение.\nЕго руки находятся\
  \ под её локтями и помогают поднимать гантели вверх.\nДвижения выглядят естественно, без резкости и преувеличений.\nДевушка плавно поднимает и опускает гантели.\nВсе движения реалистичные и физически\
  \ правдоподобные.\nЛица не изменяются, сохраняются как на исходном фото.\nБез искажений и деформаций.\nСвет, тени и перспектива сохраняются как в исходном изображении.\nБез движения камеры.\nСтиль: кинематографичный\
  \ реализм.\n6️⃣Готово\n⚠️Важно: \nПромты можно и нужно редактировать под себя, не бойтесь, читайте и меняйте, если написанно что девушка делает жим, а вы делаете видео с парнем то меняйте, можно написать\
  \ что б ребята которые подходят были в другой одежде. \n\uFEFF\n\U0001F449Сделать видео\U0001F447\nt.me/Ai_miniapp_ibot\n\n\U0001F970Дорогие подписчики отмечайте наш основной инстаграм под своими видео,\
  \ лучшее репостним!"
