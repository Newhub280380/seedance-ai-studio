prompts_verbatim:
- |-
  Ultra cinematic 3D render of Tom in Pixar-style stylized realism, maintaining 100% original identity.
  Tom is sitting comfortably on a luxury beige sofa in a modern high-end living room.

  👕 OUTFIT (NOW PERFECT)
  Premium Puma layered streetwear:
  • Outer layer: Puma jacket (beige / off-white / soft grey / muted olive)
  • Clean fit, premium fabric
  • Single visible Puma logo on jacket only
  • Inner layer: Plain oversized t-shirt
  • No logo, no graphics
  • Neutral tone (white / cream / soft grey)
  • Minimal, clean, luxury aesthetic

  👉 Key line:
  Inner t-shirt must be completely plain to keep the look premium and uncluttered.

  😄 EXPRESSION + 👀 EYES (LOCKED)
  • Bright, lively, wide-open eyes with strong reflections
  • Confident, happy smile
  • Slight mischievous Tom attitude
  • Energetic, charismatic face

  🎨 COLOR BALANCE (IMPORTANT)
  • Outfit must contrast softly with the sofa and background
  • Avoid pure black
  • Keep tones warm, premium, and aesthetic

  📸 FRAMING
  • Medium-wide shot (clearly showing seated pose on sofa)
  • Slight zoom out for breathing space
  • Cinematic composition

  💡 LIGHTING
  • Soft daylight hitting face (for eye highlights)
  • Warm ambient interior lighting
  • Balanced shadows

  🚫 NEGATIVE PROMPT ADD
  No logos on t-shirt
  No multiple logos
  No pure black outfit
  No cluttered styling
- |-
  Ultra cinematic 15-second selfie-style video of Tom sitting on a sofa in a modern luxury living room. Tom must look exactly like his original character from Tom and Jerry, but rendered in high-end Pixar-style stylized realism. His identity, face shape, eyes, expressions, and proportions must remain 100% accurate and instantly recognizable while existing naturally in a cinematic 3D environment.
  The character is wearing a premium Puma jacket in a soft neutral tone like off-white, beige, or light grey. The jacket has a single clean Puma logo. Inside, he is wearing a plain oversized t-shirt with no logo or design. The outfit should feel like a real premium fashion campaign with natural fabric folds and realistic material response.

  Framing:
  Medium close-up selfie angle, slightly zoomed out to clearly show Tom sitting on the sofa. The framing must feel natural and balanced, with enough space to showcase both Tom and the sneaker without crowding the frame.

  Lighting:
  Soft natural daylight from the front window combined with warm indoor ambient lighting. Lighting must be physically accurate and consistent across both character and product. Strong, sharp catchlights must be visible in Tom’s eyes. The sneaker must receive clean highlights that define its shape and materials.

  Action:
  Tom lifts a black and white Puma sneaker into frame and slowly rotates it. He brings it slightly closer to the camera, creating a natural focus shift, then lowers it slightly while maintaining eye contact.
  The character looks at the camera, then briefly at the shoe, then back at the camera with confident, playful energy.

  Dialogue (voice style):
  Smooth, confident, slightly mischievous male voice that feels like Tom brought to life in a modern premium ad. Natural, calm, controlled.

  Dialogue:
  "Just got these Puma sneakers."
  (slight pause, rotates shoe)
  "...clean."

  (off-screen voice — Tom’s mother, slightly distant)
  "Tom! Come here!"

  (Tom reacts naturally, slight eye shift, relaxed smile)
  "Coming, Mom."

  (looks back at camera, small wave or nod)
  "Bye."

  Expression:
  Happy, confident smirk with bright, wide-open expressive eyes. Subtle eyebrow lift, slight head movement, and natural reaction to the off-screen voice. Eyes must feel sharp, vibrant, and full of life with strong reflections.

  Realism:
  The sneaker must be exactly accurate to the real Puma product — correct shape, proportions, sole structure, stitching, logo placement, and material textures. No redesign, no distortion.

  The Puma logo must be perfectly sharp and correctly positioned.

  Camera:
  Slight handheld motion, shallow depth of field, realistic focus shift when the shoe moves closer, cinematic lens feel.

  Quality:
  Ultra high quality, photorealistic cinematic rendering, clean color grading, no artifacts, no flicker, no warping, no character distortion.

  Tone:
  Premium lifestyle product video with a playful narrative ending, feeling like a real Puma campaign blended with Tom’s world.
