title: 'Видео на ДР за 30 сек: прыжок в шпагат над своей машиной + стоп-кадр Ч/Б и надпись HB — Seedance 2.5 6 с → CapCut'
intent_tags:
- client_in_clip
- pov_one_take
use_when: Ваше фото и фото машины. Герой прыгает (шпагат) над машиной, над ним пролетает самолёт; в CapCut замедлить полёт, в конце «зависание» в Ч/Б и надпись HB.
inputs:
- фото лица/портрет человека
- стартовый кадр
- аудио/голос
- логотип
steps:
- n: 1
  action: 'Seedance 2.5: 1080p, 9:16, 6 с; загрузить своё фото (@image1) и фото авто (@image2), промпт из файла.'
  tool:
  - Seedance
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: user_input
  duration: 6 с
  aspect: '9:16'
- n: 2
  action: 'CapCut: замедлить полёт после прыжка; в конце поставить «зависание» (стоп-кадр) и убрать насыщенность до 0; написать текст HB.'
  tool:
  - CapCut
  mode: unknown
  prompt: unknown
  input_source: unknown
  duration: unknown
  aspect: unknown
prompts_verbatim:
- "Трендовое видео на ДР за 30 сек\U0001F973\U0001F525\n\nЗаходим на «сайт»\nВыбираем нейросеть Seedance 2.5\nНастройки: \nКачество- на выбор (у меня 1080)\nФормат: 9:16\nПродолжительность: 6 сек\n\nЗагружаем\
  \ свое фото и фото автомобиля, пишем промпт (промпт тут)\n\nПолученное видео загружаем в капкат. Полет после прыжка замедляем. В конце ставим «зависание» и убираем у него насыщенность до 0. Пишем текст\
  \ HB \U0001F91F\n\nСтавь реакцию, если полезно\U0001F525\U0001F447"
- |-
  Creatives Description: Based on the two uploaded images, strictly follow them in upload order: @image1 is the HERO — take their entire appearance 100% from the reference: face, gender, age, build, skin tone, hairstyle, hair color and length, clothing, shoes and every accessory exactly as in @image1, whoever they are — never altered, never redesigned, never restyled; strictly lock this identity and outfit for the whole video. @image2 is the CAR — take the car's entire appearance 100% from the reference: exact make, model, body shape, paint color, grille, headlights, wheels, rims and every detail exactly as in @image2, whatever car it is — never altered, never redesigned, never swapped. The car is in immaculate, expensive showroom condition: freshly polished, deep glossy lacquered paint reflecting the sunset sky like a mirror, spotless wheels — it must look premium and flawless. A third element needs no reference: a large PASSENGER AIRLINER on landing approach — realistic commercial jet with landing lights on, landing gear down, flying HIGH enough to always fit fully in frame.
  One-sentence summary: A breathtaking 6-second cinematic sunset clip filmed as ONE SINGLE CONTINUOUS SHOT with no cuts: the hero from @image1 stands on an empty straight road in three-quarter view, face visible, gazing off past the camera under a spectacular blazing sunset with a passenger plane approaching in the sky behind — then abruptly turns and SPRINTS toward the gleaming car from @image2, the camera chasing behind in one unbroken move — springs off the front wheel and hood and LEAPS about a meter and a half ABOVE the car into a perfect longitudinal twine, torso facing the camera, arms spread wide, looking into the lens with a calm neutral expression, a strip of burning sunset visible in the GAP between the hero and the car — while the airliner, flying high and rendered COMPLETELY inside the frame from nose to tail, passes overhead — the flight held in dramatic slow motion to the end.
  Specific plot description: 6 seconds, VERTICAL 9:16, cinematic real-footage look, ONE SINGLE CONTINUOUS SHOT — no cuts, no edits, no camera jumps: one camera flows through the whole scene in one unbroken take. Setting: a long, straight, empty asphalt road (an airport-adjacent road) stretching to the horizon, flat green fields on both sides, and a SPECTACULAR sunset sky — the lower sky burning in vivid orange, coral and crimson bands, fading up into moody blue-grey clouds; the sun low on the horizon flaring gold; everything backlit and glowing. The car from @image2 is parked on the road ahead, its polished body catching the sunset in long glossy reflections. The passenger plane is visible in the sky from the very first frame, approaching steadily, small and fully visible.   CAMERA — one continuous move: it starts as a medium shot in front of and slightly to the side of the hero; when the hero bolts, the camera swings around and CHASES low behind them along the road; as the hero climbs the car and launches, the camera sweeps smoothly lower and back, settling into a low upward-looking angle that frames the whole finale — car at the bottom, hero mid-air above it, the COMPLETE plane at the top — all in one seamless flowing move, never cutting.   [0-2s] THE STANCE AND THE BOLT: the hero from @image1 stands still on the road in THREE-QUARTER view toward the camera — face clearly visible, calm neutral expression exactly like the reference photo, gazing off past the camera, never into the lens; a soft breeze moves their hair; the plane approaches in the sky behind them, fully visible; the hero holds this still stance for about two seconds — then WITHOUT any head-turning, without searching the sky, without any extra beat — abruptly PIVOTS away from the camera and INSTANTLY explodes into a sprint toward the car: one motion, turn-and-run, zero hesitation.   [2-3.5s] THE CHASE: the hero sprints back-to-camera toward the car against the sunset — the camera whips around and RUNS after them in one unbroken low tracking move, slight handheld energy, hair and clothes streaming, sneakers pounding the asphalt with real ground contact every stride, the car's glossy silhouette blazing with reflected sunset as they close in; the plane hangs in the sky ahead, still fully visible.   [3.5-4.5s] THE ASCENT: without breaking stride the hero springs UP — one foot onto the FRONT WHEEL, next step onto the HOOD — two quick powerful steps — and LAUNCHES vertically off the hood with full force, rising high; the camera, still in the same unbroken take, glides lower and tilts up to hold them.   [4.5-6s] THE APEX IN SLOW MOTION: time dilates into dramatic SLOW MOTION within the same continuous shot — the hero hangs at the apex roughly a METER AND A HALF ABOVE the car — a clear OPEN GAP of glowing sunset sky visible BETWEEN the hero's body and the car's roofline — in a PERFECT FRONT SPLIT (продольный шпагат): ONE leg extended straight FORWARD, the OTHER straight BACKWARD, legs in one continuous horizontal line — TORSO twisted to FACE THE CAMERA: chest open to the lens, back gracefully arched, both arms spread wide in an elegant line, hair fanned out — and the hero LOOKS STRAIGHT INTO THE CAMERA with a CALM, NEUTRAL, composed expression — the same natural face as in @image1, NO smile, no grin: cool, confident, unbothered. Above them the airliner passes — flying NOTICEABLY HIGH above the scene, and because of that height the ENTIRE aircraft sits comfortably inside the upper frame with generous margin on every side: the NOSE fully in frame, the full fuselage, BOTH wings with engines, the tail fin — the complete silhouette from nose to tail, wingtip to wingtip, never touching any frame edge, never cropped — landing lights glowing, belly lit by the sunset. The layered composition holds: glossy car at the bottom, the strip of sunset in the gap, the neutral-faced front-split hero in the middle, the COMPLETE high-flying plane above, all against the burning sky. Hold this slow-motion apex to the end — the video finishes on this frame, the hero never lands on camera.
  Global supplement: VERTICAL 9:16, 6 seconds, ONE UNBROKEN CONTINUOUS TAKE — the most important technical rule: no cuts, no edits, no transitions, no angle jumps anywhere; the camera travels the entire scene in one seamless physical move — front view → chase → low finale angle — like a single drone-gimbal shot; any cut is a failure. Photorealistic cinematic footage — polished viral social-video aesthetic: rich warm color grade amplifying the sunset (deep oranges, glowing golds, moody blue shadows), gentle film-like contrast, crisp sharp subject. THE OPENING defined precisely: two seconds of stillness in three-quarter view with the face visible and a calm neutral look past the camera — then one abrupt pivot straight into the sprint: no head-swiveling, no looking around for the plane, no reaction beat, no hesitation — stand, then turn-and-run as one sharp motion. THE FINAL POSE defined precisely: a FRONT SPLIT in mid-air (grand-jeté style), NOT a side split: one leg forward, one leg backward, legs in one straight horizontal line; torso twisted toward the camera — chest, shoulders and face fully to the lens; arms spread wide; eyes INTO the lens with a NEUTRAL calm expression matching @image1 — no smile, no laugh, no grimace — the only moment of the video where the hero looks at the camera. THE HEIGHT: the leap apex is about 1.5 meters above the car — the gap of sunset sky between hero and car clearly readable. THE PLANE RULE — critical: the plane flies HIGH above the scene, high enough that at the finale the WHOLE aircraft fits inside the frame with clear margin on all sides — nose, tail and both wingtips all fully visible, nothing clipped by any frame edge at any moment of the slow-motion hold; the plane must NOT be low and huge filling the frame — it is high, complete and majestic; if in doubt, place it higher and smaller, never cropped. Real physics: genuinely fast run with real footfalls, no foot-sliding; two light springy steps up wheel and hood (car barely dips, suspension flexing subtly); a powerful believable launch; in slow motion hair, clothing and light behave physically; motion continuous — no teleporting between poses. The car remains flawless and mirror-glossy, steps leave no marks. The airliner is a realistic commercial jet, no airline logos. The hero always exactly @image1; the car always exactly @image2. Audio: no dialogue, no voiceover — cinematic sound design: soft wind and golden-hour ambience at the open, the distant airy hum of the jet; fast footsteps and quickening breath in the chase; two quick percussive thumps up the wheel and hood; then sound dilating into the slow motion — a deep airy whoosh, the jet's engine roar swelling in slowed low-frequency majesty, wind fluttering fabric — held to the end; an optional subtle rising cinematic swell under the finale is allowed, but no full music track. Prohibited: ANY cut, edit, transition or camera jump — one continuous take only; the hero's identity, outfit and hair never change from @image1; the car never changes from @image2 — never dented, never scratched, always polished; the final expression is NEVER a smile, never a grin, never exaggerated — always the calm neutral face of @image1; the final pose is NEVER a side split, NEVER legs sideways, NEVER back to camera — always the front split, torso and face to the lens; the hero looks into the camera ONLY at the apex — never earlier; NO head-turning or plane-searching before the run — stillness, then instant pivot-and-sprint; the plane is NEVER cropped, NEVER partially visible, NEVER cut by a frame edge at any point of the finale — always the complete aircraft flying high with margin on all sides; slow motion ONLY from the launch apex onward — run and climb at normal speed; no foot-sliding, no teleporting; the plane never lands, never threatens; one person, one car, one plane — empty road, no other people; no text, no captions, no subtitles, no watermarks, no logos, no license-plate close-ups; photorealistic only — no cartoon look; the video ends exactly on the held slow-motion apex — the hero never lands on camera.
