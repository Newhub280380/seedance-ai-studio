prompts_verbatim:
- |-
  Создай фотореалистичное вертикальное видео 9:16 продолжительностью 15 секунд: человек с приложенной фотографии неожиданно становится главным героем эффектной футбольной атаки. Сохрани его узнаваемость 1:1: черты лица, возраст, причёску, телосложение и исходную одежду, без переодевания в футбольную форму. Вечерний стадион, яркие прожекторы, естественные тени на газоне. Камера спортивной трансляции плавно сопровождает атаку одним непрерывным планом, удерживая в кадре игрока, мяч и ворота. Сначала герой принимает передачу и сближается с выбежавшим вратарём. На 2-4 секунде аккуратным касанием подбрасывает мяч над бросившимся голкипером. На 4-7 секунде обегает его и вновь подхватывает опустившийся мяч. На 7-12 секунде резким торможением и сменой направления заставляет двух защитников проскользить мимо в подкатах. В оставшееся время спокойно направляет мяч в открытые ворота. Естественная скорость движений, убедительный контакт обуви с мячом, реалистичные лица и фактура одежды. Исключить смену лица, лишние конечности, слияние игроков, исчезновение или удвоение мяча, скольжение стоп, монтажные скачки и пластиковую кожу.
