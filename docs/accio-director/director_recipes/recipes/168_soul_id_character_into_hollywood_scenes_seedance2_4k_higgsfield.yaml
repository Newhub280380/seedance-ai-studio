use_when: 'Автор говорит, что Seedance 2.0 блокирует загрузку своего лица напрямую, поэтому лицо идёт через персонажа Soul ID в Higgsfield: обучаешь на ~20 фото, и персонаж становится элементом, который
  вызывается в промпте (в файле — токен вида <<<b9e9949f-…>>>). Дальше в промпте описываешь, во что одет и что'
inputs:
- финальный кадр
- аудио/голос
steps:
- n: 1
  action: 'Шаг 1 — Higgsfield → поиск «Soul ID» → Create character: загрузить ~20 фото (чистое лицо, разные ракурсы, полный рост спереди и в профиль, эмоции). Совет автора: не грузить почти одинаковые фото
    — у него из-за этого появились артефакты на лице.'
  tool:
  - Higgsfield
  mode: unknown
  prompt: unknown
  input_source: user_input
  duration: unknown
  aspect: unknown
- n: 2
  action: Шаг 2 — обучение (≈25 кредитов, 10–15 мин) → персонаж становится элементом.
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: unknown
  duration: unknown
  aspect: unknown
- n: 3
  action: 'Шаг 3 — генерация видео Seedance 2.0: выбрать свой элемент (Use), дописать промпт. Учиться на 480p / 6 с, финал — 4K, 16:9, 15 с (автор сделал 7 клипов 4K и использовал 5).'
  tool:
  - Seedance
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
  input_source: unknown
  duration: 6 с
  aspect: '16:9'
- n: 4
  action: 'Шаг 4 — проблемы, о которых говорит автор: модель сама генерирует музыку (между клипами не совпадает — для серьёзной работы нужен первый/последний кадр); если подать свой голос как аудио, звук
    смешивается странно.'
  tool: unknown
  mode: unknown
  prompt: unknown
  input_source: last_frame
  duration: unknown
  aspect: unknown
- n: 5
  action: 'Промпты: 5 сцен ниже (идёт по улице в наушниках, пока за спиной супергероиня бьётся с монстром; секретный агент; мастер кунг-фу с кистью туши; трансформация; драка). <<<b9e…>>> = ваш персонаж
    Soul ID, <<<image_1/2>>> = картинки других героев.'
  tool: unknown
  mode: unknown
  prompt: see prompts_verbatim (verbatim block(s) below, from source)
