prompts_verbatim:
- "This is f*cking gold, and most people will scroll right past it\n\nWhile everyone chases one viral AI clip, I built a character who exploded from 38K to 63.7K followers in a few days. 27 posts. That’s\
  \ it.\n\nMeet Kaoru Hanayama 花山 薫 - my character. The anime yakuza from Baki brought to life. Massive build, irezumi tattoos across the shoulders and back, glasses, white gi pants, dead-calm expression.\
  \ He doesn’t flinch. He doesn’t talk. He just hits harder.\n\nMy last post about him hit 8.8M views. This 360° turn is the real secret: one face, locked from every angle, so he looks the same in every\
  \ video.\n\nThe exact workflow:\n\n→ Give him 3 loud traits. Massive Japanese fighter with traditional irezumi tattoos, thick-framed glasses, white gi pants. One look forever.\n\n→ Generate the face in\
  \ Nano Banana Pro (Google Flow), then a character sheet: front, side, back, close-ups\n\n→ Turn the sheet into a 360° video like this one. Every clip pulls from it\n\n→ Screenshot a frame from a 1M+ clip,\
  \ generate Hanayama in that angle, run both through Kling or Higgsfield\n\n→ Post 1-2 Reels a day. “I don’t dodge. I don’t block. I just hit harder.” in the bio, no text on the video\n\n→ Route traffic:\
  \ bio → Linktree → your offer\n\nA viral clip gets watched once. A character gets followed \n\nBio: “I don’t dodge. I don’t block. I just hit harder. god-given strength.”\n\nThat’s not a caption. That’s\
  \ a character bible. And anime fans are the most obsessive audience on the internet  they share, screenshot, tag friends, debate in the comments. 8.8M views on ONE clip.\n\nUpdate: a few days ago I posted\
  \ about Hanayama at 38K followers. He just crossed 63.7K. +25K in days. Same face. Same sheet. The character did the work.\n\nPrompt 1: 360° turn (Kling / Higgsfield / Seedance)\nUpload your character\
  \ sheet as the reference, not a single photo. The back view matters.\n\nPrompt: The same man from the reference stands on a plain light-grey studio background and slowly turns 360 degrees in place, clockwise,\
  \ at a steady speed: front, side, back, side, front.\nThe person rotates, the camera does not move.\nFull body in frame, arms relaxed, neutral expression, feet stay on the same spot.\nSoft even studio\
  \ light. Same face, hair, outfit and proportions in every frame.\n\nPrompt 2: motion swap (Kling Motion Control / Higgsfield / Seedance)\nInputs: your character image + a viral video with one person and\
  \ a steady camera.\nPrompt:\nReplace the main person in the video with the character from the image.\nKeep the same face, hair, outfit and body proportions in every frame.\nCopy the original movement,\
  \ gestures, expressions and timing exactly.\nKeep the original background, lighting, camera movement and audio. Lip sync if the person talks.\nMatch the source video quality, no glossy AI look.\nThe internet\
  \ is full of fake faces. The money goes to the ones that never change."
