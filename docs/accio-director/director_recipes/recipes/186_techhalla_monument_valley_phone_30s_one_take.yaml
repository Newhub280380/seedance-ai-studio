title: Фото «с телефона туриста» как первый кадр (Magnific One) → Seedance 2.5, один дубль 30 с с героями по референсам
intent_tags:
- product_ad
- client_in_clip
- pov_one_take
- animal
use_when: 'Сначала фиксируется первый кадр — «любительский снимок с телефона» на смотровой площадке Monument Valley, где на вершине скалы еле видны крошечные люди с грилем. Затем Seedance 2.5 одним дублем
  30 с без склеек «зумит» телефоном к вершине и разыгрывает сюжет: стейк, кот приносит доллар, прыжок со ска'
inputs:
- стартовый кадр
- аудио/голос
